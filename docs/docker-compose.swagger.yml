services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.11@sha256:e43eb34b978af58d8cb78e5da9c12d605cf43d113ad3a96b18f9b028d6479d68
    profiles: ["docs"]
    environment:
      SWAGGER_JSON: /spec/openapi.json
      SUPPORTED_SUBMIT_METHODS: "[]"
      DISPLAY_REQUEST_DURATION: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../openapi/openapi.json:/spec/openapi.json:ro
