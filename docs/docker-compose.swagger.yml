services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.34.1@sha256:59ee9021a8884437c7fd8aae79e0a46ee6b6dd3afd7f24a587c4501585fde53b
    profiles: ["docs"]
    environment:
      URLS: '[{"url":"/spec/openapi.json","name":"Memory Router"},{"url":"/spec/openclaw.json","name":"OpenClaw compatibility"}]'
      URLS_PRIMARY_NAME: "Memory Router"
      SUPPORTED_SUBMIT_METHODS: "[]"
      DISPLAY_REQUEST_DURATION: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../openapi:/usr/share/nginx/html/spec:ro
