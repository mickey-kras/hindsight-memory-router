ci:
  failBelow: 95

telemetry:
  enabled: false

exclude:
  - dist
  - node_modules
  - coverage
  - package-lock.json

rules:
  security/hardcoded-secret: error
  # The required npm audit gate owns dependency findings and its narrow exception.
  security/vulnerable-dependency: off
  # Replaced by the deterministic allowlist in tests/test_hardcoded_urls.py.
  ai-slop/hardcoded-url: off

quality:
  # app.py (HTTP dispatch) sits at the 900 budget ceiling on main; 950 restores headroom.
  maxFileLoc: 950
  maxFunctionLoc: 150
