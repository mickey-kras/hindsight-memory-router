[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Quarantine envelope field name"
condition = "AND"
regexTarget = "secret"
paths = ['''^ui/src/lib/quarantineCrypto\.ts$''']
regexes = ['''^wrapped_key_b64$''']

[[rules.allowlists]]
description = "Synthetic Aislop hardcoded-secret regression fixture"
condition = "AND"
regexTarget = "secret"
paths = ['''^\.github/scripts/aislop-cli\.test\.cjs$''']
regexes = ['''^abcdefghijklmnopqrstuvwxyz0123456789$''']
