sonar.projectKey=hindsight-memory-router
sonar.sources=memory_router
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# The security scanners are deliberately bounded state machines. Splitting their
# control flow further would obscure the fail-closed budgets and increase audit risk.
sonar.issue.ignore.multicriteria=securityComplexity,appComplexity,openclawComplexity,closureMutation,shutdownCancellation
sonar.issue.ignore.multicriteria.securityComplexity.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.securityComplexity.resourceKey=memory_router/**/*security*.py
sonar.issue.ignore.multicriteria.appComplexity.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.appComplexity.resourceKey=memory_router/app.py
sonar.issue.ignore.multicriteria.openclawComplexity.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.openclawComplexity.resourceKey=memory_router/openclaw.py
# S5797 does not model the nonlocal cut_short flag mutated by probe().
sonar.issue.ignore.multicriteria.closureMutation.ruleKey=python:S5797
sonar.issue.ignore.multicriteria.closureMutation.resourceKey=memory_router/security_base64.py
# Shutdown deliberately translates executor cancellation into the facade's stable 503 contract.
sonar.issue.ignore.multicriteria.shutdownCancellation.ruleKey=python:S7497
sonar.issue.ignore.multicriteria.shutdownCancellation.resourceKey=memory_router/openclaw.py
