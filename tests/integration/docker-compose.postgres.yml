services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: quarantine
      POSTGRES_USER: quarantine
      POSTGRES_PASSWORD: quarantine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarantine -d quarantine"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  hindsight:
    image: node:26-alpine
    working_dir: /workspace
    command: ["node", "fake-hindsight.js"]
    environment:
      FAKE_HINDSIGHT_LOG: /state/hindsight.jsonl
    expose:
      - "8888"
    volumes:
      - ./fake-hindsight.js:/workspace/fake-hindsight.js:ro
      - ${FAKE_HINDSIGHT_STATE_DIR:-./tmp/fake-postgres/state}:/state
    networks:
      - internal

  memory-router:
    image: hindsight-memory-router:ci
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_started
    environment:
      MEMORY_ROUTER_PORT: "8890"
      MEMORY_ROUTER_DEPLOYMENT_MODE: single
      MEMORY_ROUTER_EXTERNAL_ADMIN_RATE_LIMIT: "false"
      MEMORY_ROUTER_TOKEN: test-router-token
      MEMORY_ROUTER_ADMIN_READ_TOKEN: test-admin-read-token
      MEMORY_ROUTER_ADMIN_REVIEW_TOKEN: test-admin-review-token
      MEMORY_ROUTER_ADMIN_CLEANUP_TOKEN: test-admin-cleanup-token
      MEMORY_ROUTER_REGISTRY: /app/integration-writer-registry.json
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: test-hindsight-key
      QUARANTINE_PUBLIC_KEY: ${QUARANTINE_PUBLIC_KEY:?missing QUARANTINE_PUBLIC_KEY}
      QUARANTINE_DATABASE_URL: postgresql://quarantine:quarantine@postgres:5432/quarantine
    ports:
      - "127.0.0.1:${MEMORY_ROUTER_TEST_PORT:-8891}:8890"
    volumes:
      - ./writer-registry.json:/app/integration-writer-registry.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=opener.open('http://127.0.0.1:8890/health/ready', timeout=2); raise SystemExit(0 if 200 <= response.status < 300 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

networks:
  internal:
    driver: bridge
