services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hindsight
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: hindsight
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  llm:
    image: node:26-alpine
    working_dir: /workspace
    command: ["node", "fake-llm.js"]
    volumes:
      - ./fake-llm.js:/workspace/fake-llm.js:ro
    expose:
      - "11434"
    networks:
      - internal

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:hindsight@postgres:5432/hindsight
      HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
      HINDSIGHT_API_AUDIT_LOG_RETENTION_DAYS: "1"
      HINDSIGHT_API_LLM_TRACE_RETENTION_DAYS: "1"
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://llm:11434/v1
      HINDSIGHT_API_LLM_MODEL: ci-fake
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      HINDSIGHT_API_LLM_TIMEOUT: "60"
      HINDSIGHT_API_VECTOR_EXTENSION: pgvector
      HINDSIGHT_API_WORKER_ID: ci-hindsight
      HINDSIGHT_CP_DATAPLANE_API_URL: http://127.0.0.1:8888
      HINDSIGHT_CP_ACCESS_KEY: ci-access-key
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: test-hindsight-key
      HINDSIGHT_CP_DATAPLANE_API_KEY: test-hindsight-key
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started
    expose:
      - "8888"
    networks:
      - internal

  memory-router:
    image: hindsight-memory-router:ci
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_started
    environment:
      MEMORY_ROUTER_PORT: "8890"
      MEMORY_ROUTER_DEPLOYMENT_MODE: ${MEMORY_ROUTER_TEST_DEPLOYMENT_MODE:-cluster}
      MEMORY_ROUTER_EXTERNAL_ADMIN_RATE_LIMIT: ${MEMORY_ROUTER_TEST_EXTERNAL_ADMIN_RATE_LIMIT:-true}
      MEMORY_ROUTER_TOKEN: test-router-token
      MEMORY_ROUTER_ADMIN_READ_TOKEN: test-admin-read-token
      MEMORY_ROUTER_ADMIN_REVIEW_TOKEN: test-admin-review-token
      MEMORY_ROUTER_ADMIN_CLEANUP_TOKEN: test-admin-cleanup-token
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: test-hindsight-key
      QUARANTINE_PUBLIC_KEY: ${QUARANTINE_PUBLIC_KEY:?missing QUARANTINE_PUBLIC_KEY}
      QUARANTINE_DATABASE_URL: ${MEMORY_ROUTER_TEST_QUARANTINE_DATABASE_URL:-postgresql://hindsight:hindsight@postgres:5432/quarantine}
    expose:
      - "8890"
    volumes:
      - ${QUARANTINE_STATE_DIR:-./tmp/real-postgres/quarantine}:/state
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=opener.open('http://127.0.0.1:8890/health/ready', timeout=2); raise SystemExit(0 if 200 <= response.status < 300 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  admin-limiter:
    image: node:26-alpine
    working_dir: /workspace
    command: ["node", "fake-admin-limiter.js"]
    environment:
      ADMIN_READ_MAX: "120"
      ADMIN_WRITE_MAX: "30"
      ADMIN_WINDOW_MS: "60000"
    depends_on:
      memory-router:
        condition: service_healthy
    volumes:
      - ./fake-admin-limiter.js:/workspace/fake-admin-limiter.js:ro
    ports:
      - "127.0.0.1:8890:8890"
    networks:
      - internal

networks:
  internal:
    driver: bridge
