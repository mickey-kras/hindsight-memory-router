services:
  hindsight:
    image: node:26-alpine
    working_dir: /workspace
    command: ["node", "fake-hindsight.js"]
    environment:
      FAKE_HINDSIGHT_LOG: /state/hindsight.jsonl
    expose:
      - "8888"
    volumes:
      - ./fake-hindsight.js:/workspace/fake-hindsight.js:ro
      - ./tmp/fake/state:/state
    networks:
      - internal

  memory-router:
    image: hindsight-memory-router:ci
    depends_on:
      - hindsight
    environment:
      MEMORY_ROUTER_PORT: "8890"
      MEMORY_ROUTER_DEPLOYMENT_MODE: single
      MEMORY_ROUTER_EXTERNAL_ADMIN_RATE_LIMIT: "false"
      MEMORY_ROUTER_TOKEN: test-router-token
      MEMORY_ROUTER_ADMIN_READ_TOKEN: test-admin-token
      MEMORY_ROUTER_ADMIN_REVIEW_TOKEN: test-admin-token
      MEMORY_ROUTER_ADMIN_CLEANUP_TOKEN: test-admin-token
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: test-hindsight-key
      QUARANTINE_PUBLIC_KEY: ${QUARANTINE_PUBLIC_KEY:?missing QUARANTINE_PUBLIC_KEY}
      QUARANTINE_DATABASE_URL: sqlite:/state/quarantine.db
    ports:
      - "127.0.0.1:8890:8890"
    volumes:
      - ./tmp/fake/quarantine:/state
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8890/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

networks:
  internal:
    driver: bridge
