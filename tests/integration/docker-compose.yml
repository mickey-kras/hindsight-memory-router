services:
  hindsight:
    image: node:26-alpine
    working_dir: /workspace
    command: ["node", "fake-hindsight.js"]
    environment:
      FAKE_HINDSIGHT_LOG: /state/hindsight.jsonl
    expose:
      - "8888"
    volumes:
      - ./fake-hindsight.js:/workspace/fake-hindsight.js:ro
      - ${FAKE_HINDSIGHT_STATE_DIR:-./tmp/fake-sqlite/state}:/state
    networks:
      - internal

  memory-router:
    image: hindsight-memory-router:ci
    depends_on:
      - hindsight
    environment:
      MEMORY_ROUTER_PORT: "8890"
      MEMORY_ROUTER_DEPLOYMENT_MODE: single
      MEMORY_ROUTER_EXTERNAL_ADMIN_RATE_LIMIT: "false"
      MEMORY_ROUTER_TOKEN: test-router-token
      MEMORY_ROUTER_ADMIN_READ_TOKEN: test-admin-read-token
      MEMORY_ROUTER_ADMIN_REVIEW_TOKEN: test-admin-review-token
      MEMORY_ROUTER_ADMIN_CLEANUP_TOKEN: test-admin-cleanup-token
      MEMORY_ROUTER_REGISTRY: /app/integration-writer-registry.json
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: test-hindsight-key
      # Integration harness exercises the full facade matrix for one writer in
      # a single rate-limit window; production keeps the default of 30.
      HINDSIGHT_RETAIN_RATE_LIMIT_WRITER_MAX: "64"
      QUARANTINE_PUBLIC_KEY: ${QUARANTINE_PUBLIC_KEY:?missing QUARANTINE_PUBLIC_KEY}
      QUARANTINE_DATABASE_URL: sqlite:/state/quarantine.db
    ports:
      - "127.0.0.1:${MEMORY_ROUTER_TEST_PORT:-8890}:8890"
    volumes:
      - ${QUARANTINE_STATE_DIR:-./tmp/fake-sqlite/quarantine}:/state
      - ./writer-registry.json:/app/integration-writer-registry.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=opener.open('http://127.0.0.1:8890/health/ready', timeout=2); raise SystemExit(0 if 200 <= response.status < 300 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  memory-router-principals:
    image: hindsight-memory-router:ci
    depends_on:
      - hindsight
    environment:
      MEMORY_ROUTER_PORT: "8890"
      MEMORY_ROUTER_DEPLOYMENT_MODE: single
      MEMORY_ROUTER_EXTERNAL_ADMIN_RATE_LIMIT: "false"
      MEMORY_ROUTER_PRINCIPALS: /app/integration-principal-registry.json
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: test-hindsight-key
      QUARANTINE_PUBLIC_KEY: ${QUARANTINE_PUBLIC_KEY:?missing QUARANTINE_PUBLIC_KEY}
      QUARANTINE_DATABASE_URL: sqlite:/tmp/quarantine.db
    ports:
      - "127.0.0.1:${MEMORY_ROUTER_TEST_PRINCIPALS_PORT:-8892}:8890"
    volumes:
      - ./principal-registry.json:/app/integration-principal-registry.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=opener.open('http://127.0.0.1:8890/health/ready', timeout=2); raise SystemExit(0 if 200 <= response.status < 300 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

networks:
  internal:
    driver: bridge
