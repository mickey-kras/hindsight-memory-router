                      - pattern: $UTIL.format($HTMLSTR, ...)
                      - pattern: format($HTMLSTR, ...)
                  - metavariable-pattern:
                      metavariable: $HTMLSTR
                      language: generic
                      pattern: <$TAG ...
              - patterns:
                  - pattern: |
                      `...${...}...`
                  - pattern-regex: |
                      .*<\w+.*
          - pattern-not-inside: |
              console.$LOG(...)
