      vulnerability.
    languages:
      - javascript
      - typescript
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              function ... (...,$FUNC,...) {
                ...
              }
          - focus-metavariable: $FUNC
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  require('child_process')
                  ...
              - pattern-inside: |
                  import 'child_process'
                  ...
          - pattern-either:
              - pattern: spawn(...)
              - pattern: spawnSync(...)
              - pattern: $CP.spawn(...)
              - pattern: $CP.spawnSync(...)
          - pattern-either:
              - pattern: |
                  $EXEC("=~/(sh|bash|ksh|csh|tcsh|zsh)/",["-c", $ARG, ...],...)
              - patterns:
                  - pattern: $EXEC($CMD,["-c", $ARG, ...],...)
                  - pattern-inside: |
                      $CMD = "=~/(sh|bash|ksh|csh|tcsh|zsh)/"
                      ...
              - pattern: |
                  $EXEC("=~/(sh|bash|ksh|csh|tcsh|zsh)/",[$ARG, ...],...)
              - patterns:
                  - pattern: $EXEC($CMD,[$ARG, ...],...)
                  - pattern-inside: |
                      $CMD = "=~/(sh|bash|ksh|csh|tcsh|zsh)/"
                      ...
