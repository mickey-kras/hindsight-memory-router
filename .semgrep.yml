# Curated Semgrep rules for the Python runtime and repository configuration.
rules:
  - id: python.dynamic-eval
    message: Avoid dynamic eval/exec on runtime data.
    languages: [python]
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: python.subprocess-shell-true
    message: subprocess with shell=True can enable command injection.
    languages: [python]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: python.pickle-loads
    message: Do not deserialize untrusted data with pickle.
    languages: [python]
    severity: ERROR
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  - id: python.yaml-unsafe-load
    message: Use yaml.safe_load instead of yaml.load for untrusted YAML.
    languages: [python]
    severity: WARNING
    pattern: yaml.load(...)

  - id: github-actions.shell-injection
    message: Do not interpolate GitHub event data directly into run steps.
    languages: [yaml]
    severity: ERROR
    patterns:
      - pattern-inside: |
          steps:
            ...
      - pattern: |
          run: $RUN
      - metavariable-regex:
          metavariable: $RUN
          regex: '.*\$\{\{.*github\.event\..*\}\}.*'

  - id: compose.privileged-service
    message: Containers must not run privileged.
    languages: [yaml]
    severity: ERROR
    patterns:
      - pattern-inside: |
          services:
            ...
      - pattern: |
          privileged: true

  - id: compose.docker-socket
    message: Do not expose the host Docker socket to containers.
    languages: [yaml]
    severity: ERROR
    pattern-regex: '/(?:var/)?run/docker\.sock'
