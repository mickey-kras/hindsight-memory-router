              - pattern-inside: function ... ($REQ, $RES) {...}
              - pattern-inside: function ... ($REQ, $RES, $NEXT) {...}
              - patterns:
                  - pattern-either:
                      - pattern-inside: $APP.$METHOD(..., function $FUNC($REQ, $RES) {...})
                      - pattern-inside: $APP.$METHOD(..., function $FUNC($REQ, $RES, $NEXT) {...})
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|post|put|head|delete|options)$
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
              - pattern: $REQ.files.$ANYTHING.data.toString('utf8')
              - pattern: $REQ.files.$ANYTHING['data'].toString('utf8')
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  ({ $REQ }: Request,$RES: Response, $NEXT: NextFunction) =>
                  {...}
              - pattern-inside: |
                  ({ $REQ }: Request,$RES: Response) => {...}
          - focus-metavariable: $REQ
          - pattern-either:
              - pattern: params
              - pattern: query
              - pattern: cookies
              - pattern: headers
              - pattern: body
              - pattern: files.$ANYTHING.data.toString('utf8')
              - pattern: files.$ANYTHING['data'].toString('utf8')
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $XML = require('$IMPORT')
                      ...
                  - pattern-inside: |
                      import $XML from '$IMPORT'
                        ...
                  - pattern-inside: |
                      import * as $XML from '$IMPORT'
                      ...
              - metavariable-regex:
                  metavariable: $IMPORT
                  regex: ^(libxmljs|libxmljs2)$
              - pattern-inside: $XML.$FUNC($QUERY, {...,noent:true,...})
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: ^(parseXmlString|parseXml)$
              - focus-metavariable: $QUERY
  - id: javascript.express.security.audit.express-libxml-vm-noent.express-libxml-vm-noent
    message:
      Detected use of parseXml() function with the `noent` field set to `true`.
      This can lead to an XML External Entities (XXE) attack if untrusted data is passed
      into it.
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $VM.runInContext("$CMD", ...)
                  - pattern: $VM.runInNewContext("$CMD", ...)
                  - pattern: $VM.runInThisContext("$CMD", ...)
                  - pattern: $VM.compileFunction("$CMD", ...)
              - metavariable-pattern:
                  metavariable: $CMD
                  language: typescript
                  pattern-either:
                    - pattern: |
                        $LIBXML.parseXml($DATA, {..., noent: true, ...}, ...)
                    - patterns:
                        - pattern-inside: |
                            $OPTS = {..., noent: true, ...}
                            ...
                        - pattern: $LIBXML.parseXml( $DATA, $OPTS )
          - pattern: |
              $LIBXML.parseXml($DATA, {..., noent: true, ...}, ...)
          - patterns:
              - pattern-inside: |
                  $OPTS = {..., noent: true, ...}
                  ...
              - pattern: $LIBXML.parseXml( $DATA, $OPTS )
  - id: javascript.express.security.audit.express-open-redirect.express-open-redirect
