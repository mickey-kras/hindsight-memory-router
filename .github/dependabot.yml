version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      cronjob: "3 1 * * *"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "3 3 * * *"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: "3 5 * * *"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "3 7 * * *"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
