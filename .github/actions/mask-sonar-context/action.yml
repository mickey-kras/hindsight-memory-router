name: Mask SonarQube context
description: >-
  Mask the configured or the advertised SonarQube endpoint in the job log.
  Run this action before each step that can print the endpoint.
inputs:
  mode:
    description: "`configured` masks the endpoint. `advertised` also gets and masks the server base URL."
    required: true
  sonar-host-url:
    description: The configured SonarQube endpoint.
    required: true
  sonar-token:
    description: The SonarQube token. Only the `advertised` mode uses it.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Inputs reach the script only through the environment, never through the command line.
    - name: Mask SonarQube endpoint
      shell: bash
      env:
        MASK_MODE: ${{ inputs.mode }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/mask-sonar-context.py" "$MASK_MODE"
