name: architecture-pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/architecture/workspace.dsl'
      - 'scripts/architecture.sh'
      - 'Makefile'
      - '.github/workflows/architecture-pages.yml'
  workflow_dispatch:

concurrency:
  group: architecture-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - name: Check GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/pages.json" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          case "$status" in
            200)
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo '::notice::GitHub Pages is not enabled. Set Settings > Pages > Build and deployment > Source to GitHub Actions.'
              ;;
            *)
              cat "$RUNNER_TEMP/pages.json" >&2
              printf 'GitHub Pages status check failed with HTTP %s\n' "$status" >&2
              exit 1
              ;;
          esac

  publish:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build interactive architecture
        run: make architecture-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .architecture-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
