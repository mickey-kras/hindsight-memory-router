name: architecture-pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/architecture/workspace.dsl'
      - 'scripts/architecture.sh'
      - 'Makefile'
      - '.github/workflows/architecture-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Build interactive architecture
        run: make architecture-site

      - name: Publish architecture-pages branch
        run: |
          cp -a .architecture-site "$RUNNER_TEMP/architecture-site"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin architecture-pages
          git switch -C architecture-pages origin/architecture-pages
          git rm -rf .
          git clean -fdx
          cp -a "$RUNNER_TEMP/architecture-site/." .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish architecture'
          git push origin HEAD:architecture-pages
