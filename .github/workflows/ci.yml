name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - name: Materialize reviewed Python port
        shell: bash
        run: |
          set -euo pipefail
          cat .port-bootstrap/payload.part.* | base64 -d > /tmp/port.tar.gz
          echo 'bd124bb4a1c25ba849509e17e8885222ce436fc9eb9d9703f6b3b2b32cbe753e  /tmp/port.tar.gz' | sha256sum --check
          tar -xzf /tmp/port.tar.gz -C .
          rm -rf src
          find tests -type f \( -name '*.ts' -o -name '*.tsx' \) -delete
          rm -f tsconfig.json vitest.config.ts eslint.config.js
          rm -rf .port-bootstrap
          rm -f .github/workflows/port-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Port runtime to Python and integrate OWASP AMG'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
