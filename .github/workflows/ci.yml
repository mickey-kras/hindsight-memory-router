name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[dev]'

      - name: Python runtime lock is current
        run: |
          pip-compile --generate-hashes --strip-extras --no-header --no-annotate \
            --output-file requirements.generated.txt pyproject.toml
          diff -u requirements.txt requirements.generated.txt

      - run: npm ci

      - name: No legacy TypeScript runtime or tests
        run: |
          set -euo pipefail
          for path in src tsconfig.json vitest.config.ts eslint.config.js; do
            if [ -e "$path" ]; then
              echo "obsolete TypeScript artifact remains: $path" >&2
              exit 1
            fi
          done
          if find tests -type f \( -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .; then
            echo "obsolete TypeScript test remains under tests/" >&2
            find tests -type f \( -name '*.ts' -o -name '*.tsx' \) -print >&2
            exit 1
          fi

      - run: ruff format --diff memory_router tests
      - run: ruff check memory_router tests
      - run: mypy memory_router

      - name: OpenAPI contract
        id: openapi-lint
        run: |
          set -o pipefail
          npm run openapi:lint 2>&1 | tee openapi-lint.log

      - name: Upload OpenAPI diagnostics
        if: failure() && steps.openapi-lint.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-lint-diagnostics
          path: openapi-lint.log
          if-no-files-found: error

      - name: Tests and coverage
        run: coverage run -m pytest && coverage report --fail-under=90

      - name: Python dependency audit
        run: pip-audit -r requirements.txt

      - name: Bandit
        run: bandit -q -r memory_router

      - name: Node tooling audit
        run: npm audit --audit-level=moderate

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Semgrep
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b"
          docker pull "$SEMGREP_IMAGE"
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --config .semgrep.yml --exclude .semgrep.yml --error

      - name: Hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Docker build
        run: docker build -t hindsight-memory-router:ci .

      - name: Default Compose bootstrap smoke
        run: bash tests/integration/default-compose-smoke.sh

      - name: Fake Hindsight compose smoke
        id: fake-smoke
        run: |
          set -o pipefail
          bash tests/integration/smoke.sh fake 2>&1 | tee fake-smoke.log

      - name: Upload fake smoke diagnostics
        if: failure() && steps.fake-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fake-smoke-diagnostics
          path: fake-smoke.log
          if-no-files-found: error

      - name: Real Hindsight compose smoke
        id: real-smoke
        run: |
          set -o pipefail
          bash tests/integration/smoke.sh real 2>&1 | tee real-smoke.log

      - name: Upload real smoke diagnostics
        if: failure() && steps.real-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-smoke-diagnostics
          path: real-smoke.log
          if-no-files-found: error

  aislop:
    name: aislop status
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aislop quality gate
        run: npm run aislop:ci:human

      - name: Aislop SARIF
        if: always()
        run: npm run --silent aislop:ci:sarif > aislop.sarif

      - name: Upload Aislop SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: aislop.sarif
