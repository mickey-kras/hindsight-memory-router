name: ci

on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        default: ''
      candidate_ref:
        type: string
        default: ''
    outputs:
      hindsight_version:
        value: ${{ jobs.hindsight.outputs.version }}
      hindsight_sha:
        value: ${{ jobs.hindsight.outputs.sha }}
      hindsight_image:
        value: ${{ jobs.hindsight.outputs.image }}
      coverage_artifact_id:
        value: ${{ jobs.python.outputs.coverage_artifact_id }}
      coverage_run_attempt:
        value: ${{ jobs.python.outputs.coverage_run_attempt }}

concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.candidate_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.classify.outputs.python }}
      ui: ${{ steps.classify.outputs.ui }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify complete PR diff with trusted base code
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        with:
          script: |
            const workers = ['python', 'ui', 'release'];
            let plan = Object.fromEntries(workers.map(name => [name, true]));
            if (context.eventName === 'pull_request' && !process.env.CANDIDATE_SHA && !process.env.CANDIDATE_REF) {
              let directory;
              const fs = require('node:fs');
              try {
                const baseSha = context.payload.pull_request.base.sha;
                const headSha = context.payload.pull_request.head.sha;
                if (![baseSha, headSha].every(sha => /^[a-f0-9]{40}$/.test(sha))) throw new Error('Invalid commit');
                // Never execute the PR's classifier, including its bootstrap PR.
                const source = require('node:child_process').execFileSync('git',
                  ['show', `${baseSha}:.github/scripts/ci-impact.cjs`], { timeout: 30000, maxBuffer: 1024 * 1024 });
                directory = fs.mkdtempSync(require('node:path').join(process.env.RUNNER_TEMP, 'ci-impact-'));
                const script = require('node:path').join(directory, 'ci-impact.cjs');
                fs.writeFileSync(script, source);
                const result = require(script).impact({ eventName: context.eventName, baseSha, headSha });
                if (Object.keys(result).sort().join(',') !== workers.slice().sort().join(',') ||
                    workers.some(name => typeof result[name] !== 'boolean')) throw new Error('Invalid classification');
                plan = result;
              } catch {
                core.warning('Classification unavailable or untrusted; running full validation.');
              } finally {
                if (directory) fs.rmSync(directory, { recursive: true, force: true });
              }
            }
            for (const name of workers) {
              core.setOutput(name, String(plan[name]));
              core.info(`${name}: ${plan[name] ? 'full validation' : 'proven unaffected; explicit no-op'}`);
            }

  hindsight:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true || inputs.candidate_sha != '' || inputs.candidate_ref != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Resolve Hindsight once
        id: resolve
        env:
          RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_CANDIDATE_REF: ${{ inputs.candidate_ref }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./.github/scripts/release.cjs').resolve({ github, context, core, target: process.env.RELEASE_CANDIDATE_SHA ? { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } : undefined });

  # The required `aislop status` gate runs in aislop.yml on PRs and through publish.yml on main.
  python:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true || inputs.candidate_sha != '' || inputs.candidate_ref != ''
    needs: [changes, hindsight]
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.completed.outputs.validation }}
      coverage_artifact_id: ${{ steps.coverage-upload.outputs.artifact-id }}
      coverage_run_attempt: ${{ steps.coverage-evidence.outputs.run_attempt }}
    steps:
      - name: Explicit successful no-op
        if: needs.changes.outputs.python == 'false'
        run: echo 'python validation is unaffected by the complete PR diff.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.python != 'false' }}
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        if: ${{ needs.changes.outputs.python != 'false' }}
        with:
          egress-policy: audit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        if: ${{ needs.changes.outputs.python != 'false' }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            build-requirements.txt
            requirements.txt
            dev-requirements.txt

      - name: No tracked Python caches or package metadata
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: |
          python .github/scripts/check-tracked-artifacts.py
          python .github/scripts/check-tracked-artifacts.test.py

      - run: python -m pip install 'pip==26.2.1'
        if: ${{ needs.changes.outputs.python != 'false' }}
      - name: Install verified Python build backend
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: python -m pip install --require-hashes --only-binary=':all:' --force-reinstall -r build-requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
        if: ${{ needs.changes.outputs.python != 'false' }}
      - run: python -m pip install --require-hashes -r dev-requirements.txt
        if: ${{ needs.changes.outputs.python != 'false' }}
      - run: python -m pip install --no-build-isolation --no-deps -e .
        if: ${{ needs.changes.outputs.python != 'false' }}

      - name: Python builder lock is current
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: |
          cp build-requirements.txt build-requirements.expected.txt
          pip-compile --generate-hashes --no-reuse-hashes --strip-extras --no-header --no-annotate \
            --allow-unsafe --only-build-deps --all-build-deps --no-build-isolation \
            --output-file build-requirements.txt pyproject.toml
          diff -u build-requirements.expected.txt build-requirements.txt

      - name: Offline Python wheel and backend hash rejection
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: bash tests/integration/python-build.sh

      - name: Python runtime lock is current
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: |
          cp requirements.txt requirements.expected.txt
          pip-compile --generate-hashes --strip-extras --no-header --no-annotate \
            --output-file requirements.txt pyproject.toml
          diff -u requirements.expected.txt requirements.txt

      - name: Python dev lock is current
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: |
          cp dev-requirements.txt dev-requirements.expected.txt
          printf 'pip==26.2.1\n' > dev-constraints.txt
          pip-compile --generate-hashes --strip-extras --no-header --no-annotate \
            --allow-unsafe --extra dev -c dev-constraints.txt \
            --output-file dev-requirements.txt pyproject.toml
          diff -u dev-requirements.expected.txt dev-requirements.txt

      - name: No legacy TypeScript runtime or tests
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: |
          set -euo pipefail
          for path in src tsconfig.json vitest.config.ts eslint.config.js; do
            if [ -e "$path" ]; then
              echo "obsolete TypeScript artifact remains: $path" >&2
              exit 1
            fi
          done
          if find tests -type f \( -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .; then
            echo "obsolete TypeScript test remains under tests/" >&2
            find tests -type f \( -name '*.ts' -o -name '*.tsx' \) -print >&2
            exit 1
          fi

      - name: Checkout current Hindsight OpenClaw sources
        if: ${{ needs.changes.outputs.python != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vectorize-io/hindsight
          ref: ${{ needs.hindsight.outputs.sha }}
          path: .upstream/hindsight
          persist-credentials: false

      - name: OpenClaw compatibility inventory
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: python scripts/check_openclaw_compat.py .upstream/hindsight

      - name: Unicode confusables map is reproducible
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: |
          cp memory_router/confusables_ascii.json /tmp/confusables_ascii.expected.json
          python scripts/generate_confusables_ascii.py
          diff -u /tmp/confusables_ascii.expected.json memory_router/confusables_ascii.json

      - run: ruff format --diff memory_router tests .github/scripts/sync-sonar-findings.py .github/scripts/mask-sonar-context.py .github/scripts/coverage-artifact.py .github/scripts/coverage-artifact.test.py
        if: ${{ needs.changes.outputs.python != 'false' }}
      - run: ruff check memory_router tests .github/scripts/sync-sonar-findings.py .github/scripts/mask-sonar-context.py .github/scripts/coverage-artifact.py .github/scripts/coverage-artifact.test.py
        if: ${{ needs.changes.outputs.python != 'false' }}
      - run: mypy memory_router
        if: ${{ needs.changes.outputs.python != 'false' }}

      - name: Tests and coverage
        if: ${{ needs.changes.outputs.python != 'false' }}
        # Each pytest worker can start four scanner processes; keep the worker count bounded.
        run: python -m pytest -n 2 --cov --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=90 --durations=30
      - name: Prepare authoritative coverage evidence
        id: coverage-evidence
        if: ${{ success() && needs.changes.outputs.python != 'false' && inputs.candidate_sha == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -m coverage xml
          python .github/scripts/coverage-artifact.py prepare "$RUNNER_TEMP/coverage-evidence"

      - name: Upload authoritative coverage evidence
        id: coverage-upload
        if: ${{ success() && needs.changes.outputs.python != 'false' && inputs.candidate_sha == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ inputs.candidate_sha || github.sha }}-${{ github.run_attempt }}-${{ steps.coverage-evidence.outputs.config_sha256 }}
          path: |
            ${{ runner.temp }}/coverage-evidence/coverage.xml
            ${{ runner.temp }}/coverage-evidence/manifest.json
          if-no-files-found: error

      - name: Record successful validation
        id: completed
        env:
          AFFECTED: ${{ needs.changes.outputs.python }}
        run: |
          if [ "$AFFECTED" = 'false' ]; then
            echo 'validation=noop' >> "$GITHUB_OUTPUT"
          else
            echo 'validation=full' >> "$GITHUB_OUTPUT"
          fi

  ui:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true || inputs.candidate_sha != '' || inputs.candidate_ref != ''
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.completed.outputs.validation }}
    steps:
      - name: Explicit successful no-op
        if: needs.changes.outputs.ui == 'false'
        run: echo 'ui validation is unaffected by the complete PR diff.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.ui != 'false' }}
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        if: ${{ needs.changes.outputs.ui != 'false' }}
        with:
          egress-policy: audit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        if: ${{ needs.changes.outputs.ui != 'false' }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ needs.changes.outputs.ui != 'false' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # UI lifecycle hooks generate crypto fixtures with the router's Python code.
      - run: python -m pip install 'pip==26.2.1'
        if: ${{ needs.changes.outputs.ui != 'false' }}
      - run: python -m pip install --require-hashes -r requirements.txt
        if: ${{ needs.changes.outputs.ui != 'false' }}

      - run: npm ci
        if: ${{ needs.changes.outputs.ui != 'false' }}
      - run: npm ci --prefix ui
        if: ${{ needs.changes.outputs.ui != 'false' }}

      - name: Aislop CLI regression tests
        if: ${{ needs.changes.outputs.ui != 'false' }}
        run: node --test .github/scripts/aislop-cli.test.cjs

      - name: UI unit, crypto, and build checks
        if: ${{ needs.changes.outputs.ui != 'false' }}
        run: npm test --prefix ui && npm run build --prefix ui

      - name: UI package consumer check
        if: ${{ needs.changes.outputs.ui != 'false' }}
        run: npm run test:package --prefix ui

      - name: Install Playwright Chromium
        if: ${{ needs.changes.outputs.ui != 'false' }}
        run: npx --prefix ui playwright install --with-deps chromium

      - name: UI browser tests
        if: ${{ needs.changes.outputs.ui != 'false' }}
        run: npm run test:e2e --prefix ui

      - name: OpenAPI contract
        if: ${{ needs.changes.outputs.ui != 'false' }}
        id: openapi-lint
        run: |
          set -o pipefail
          npm run openapi:lint 2>&1 | tee openapi-lint.log

      - name: Upload OpenAPI diagnostics
        if: ${{ needs.changes.outputs.ui != 'false' && (failure() && steps.openapi-lint.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-lint-diagnostics-${{ inputs.candidate_sha || github.sha }}-${{ github.run_attempt }}
          path: openapi-lint.log
          if-no-files-found: error
      - name: Record successful validation
        id: completed
        env:
          AFFECTED: ${{ needs.changes.outputs.ui }}
        run: |
          if [ "$AFFECTED" = 'false' ]; then
            echo 'validation=noop' >> "$GITHUB_OUTPUT"
          else
            echo 'validation=full' >> "$GITHUB_OUTPUT"
          fi

  release:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true || inputs.candidate_sha != '' || inputs.candidate_ref != ''
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.completed.outputs.validation }}
    steps:
      - name: Explicit successful no-op
        if: needs.changes.outputs.release == 'false'
        run: echo 'release validation is unaffected by the complete PR diff.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.release != 'false' }}
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        if: ${{ needs.changes.outputs.release != 'false' }}
        with:
          egress-policy: audit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        if: ${{ needs.changes.outputs.release != 'false' }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ needs.changes.outputs.release != 'false' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - run: python -m pip install 'pip==26.2.1'
        if: ${{ needs.changes.outputs.release != 'false' }}
      - run: python -m pip install --require-hashes -r dev-requirements.txt
        if: ${{ needs.changes.outputs.release != 'false' }}

      - name: Install release tools
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund

      - name: npm audit filter tests
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: node --test .github/scripts/npm-audit.test.cjs

      - name: Release automation tests
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: node --test .github/scripts/release.test.cjs .github/scripts/publish-image.test.cjs .github/scripts/release-cleanup.test.cjs .github/scripts/provenance.test.cjs .github/scripts/attest-image.test.cjs

      - name: Install Cosign for local attestation smoke
        if: ${{ needs.changes.outputs.release != 'false' }}
        uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
        with:
          cosign-release: v3.1.3

      - name: Attestation CLI and registry compatibility
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: bash .github/scripts/attestation-smoke.sh

      - name: Draft readiness contract tests
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: python .github/scripts/pr-readiness.test.py

      - name: CI dependency classification tests
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: node --test .github/scripts/ci-impact.test.cjs

      - name: Coverage evidence tests
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: python .github/scripts/coverage-artifact.test.py

      - name: Release policy tests
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: python3 .github/scripts/release-policy.test.py

      - name: PR branch updater tests
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: node --test .github/scripts/pr-branch-updater.test.cjs

      - name: Failure reporter tests
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: node --test .github/scripts/report-main-failures.test.cjs
      - name: Record successful validation
        id: completed
        env:
          AFFECTED: ${{ needs.changes.outputs.release }}
        run: |
          if [ "$AFFECTED" = 'false' ]; then
            echo 'validation=noop' >> "$GITHUB_OUTPUT"
          else
            echo 'validation=full' >> "$GITHUB_OUTPUT"
          fi

  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true || inputs.candidate_sha != '' || inputs.candidate_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - run: python -m pip install 'pip==26.2.1'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install --require-hashes -r dev-requirements.txt

      - name: Install supported audit client
        # npm < 11 audits through the retired /audits/quick endpoint (HTTP 400
        # "endpoint is being retired"); npm 11 queries the supported bulk
        # advisory endpoint. Upgrade once so every later audit step benefits.
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Audit release tools
        run: |
          # Retry only shields transient registry errors; the endpoint
          # retirement itself is handled by the npm 11 upgrade above.
          for attempt in 1 2 3; do
            if npm audit --prefix .github/scripts --audit-level=moderate; then exit 0; fi
            echo "npm audit attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - run: npm ci
      - run: npm ci --prefix ui

      - name: Python dependency audit
        run: |
          for attempt in 1 2 3; do
            if pip-audit -r requirements.txt > "$RUNNER_TEMP/pip-audit.log" 2>&1; then
              cat "$RUNNER_TEMP/pip-audit.log"
              exit 0
            else
              status=$?
            fi
            cat "$RUNNER_TEMP/pip-audit.log"
            if ! grep -Eq '^(requests\.exceptions\.(ConnectionError|Timeout|ConnectTimeout|ReadTimeout)|urllib3\.exceptions\.(ProtocolError|MaxRetryError|ReadTimeoutError)|ConnectionResetError):' "$RUNNER_TEMP/pip-audit.log" || [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            echo "::warning::Python audit connection failed; retrying ($attempt/3)"
            sleep "$((attempt * 5))"
          done

      - name: Bandit
        run: bandit -q -r memory_router

      - name: Node tooling audit
        run: |
          node .github/scripts/npm-audit.cjs
          node .github/scripts/npm-audit.cjs ui

      - name: Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Upload redacted secret scan
        if: ${{ !cancelled() && (steps.gitleaks.outcome == 'success' || steps.gitleaks.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitleaks-${{ inputs.candidate_sha || github.sha }}-${{ github.run_attempt }}
          path: results.sarif
          if-no-files-found: error

      - name: Semgrep
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b"
          docker pull "$SEMGREP_IMAGE"
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --config .semgrep.yml --exclude .semgrep.yml --error

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  # Preserve the required `quality / checks` identity and fail closed on every gate.
  checks:
    needs: [changes, hindsight, python, ui, release, security, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        with:
          script: |
            if (process.env.EVENT_NAME === 'pull_request' && process.env.PR_DRAFT === 'true') {
              core.setFailed('Draft feedback is not merge validation. Mark ready for review to run all gates.');
              return;
            }
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const required = ['changes', 'hindsight', 'python', 'ui', 'release', 'security', 'container'];
            for (const name of required) {
              const expected = name === 'container' && process.env.EVENT_NAME !== 'pull_request'
                ? 'skipped' : 'success';
              const result = needs[name]?.result;
              if (result !== expected) {
                core.setFailed(`${name}: expected ${expected}, got ${result ?? 'missing'}`);
              }
            }
            for (const name of ['python', 'ui', 'release']) {
              const affected = needs.changes?.outputs?.[name];
              if (!['true', 'false'].includes(affected)) core.setFailed(`Missing or invalid classification: ${name}`);
              const expected = affected === 'false' ? 'noop' : 'full';
              if (needs[name]?.outputs?.validation !== expected) core.setFailed(`Missing or mismatched validation: ${name}`);
              if (expected === 'noop' && (process.env.EVENT_NAME !== 'pull_request' ||
                  process.env.CANDIDATE_SHA || process.env.CANDIDATE_REF)) core.setFailed(`Full validation required: ${name}`);
            }
            for (const name of Object.keys(needs)) {
              if (!required.includes(name)) core.setFailed(`Unexpected quality gate: ${name}`);
            }

      - name: Require current ready PR revision
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const expected = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: expected.number,
            });
            if (current.state !== 'open' || current.draft !== false ||
                current.head.sha !== expected.head.sha || current.base.sha !== expected.base.sha) {
              core.setFailed('PR state or revision changed. Fresh ready-for-review validation is required.');
            }

  container:
    needs: hindsight
    name: container
    if: github.event_name == 'pull_request' && (github.event.pull_request.draft != true || inputs.candidate_sha != '' || inputs.candidate_ref != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      HINDSIGHT_TEST_IMAGE: ${{ needs.hindsight.outputs.image }}
      SOURCE_IMAGE: hindsight-memory-router:ci
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ env.SOURCE_IMAGE }}

      - name: Installed Python package and runtime contents
        run: |
          docker run --rm --network none --entrypoint python \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            "$SOURCE_IMAGE" -I /source/tests/integration/python-package.py /source --container

      - name: Default Compose smoke
        run: bash tests/integration/default-compose-smoke.sh

      - name: Fake Hindsight router-storage parity
        id: fake-smoke
        run: |
          set -uo pipefail
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake sqlite > >(tee fake-sqlite-smoke.log) 2>&1 &
          sqlite_pid=$!
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake postgres > >(tee fake-postgres-smoke.log) 2>&1 &
          postgres_pid=$!
          status=0
          wait "$sqlite_pid" || status=1
          wait "$postgres_pid" || status=1
          exit "$status"

      - name: Upload fake smoke diagnostics
        if: failure() && steps.fake-smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fake-smoke-diagnostics-${{ inputs.candidate_sha || github.sha }}-${{ github.run_attempt }}
          path: |
            fake-sqlite-smoke.log
            fake-postgres-smoke.log
          if-no-files-found: error

      - name: Real Hindsight router-storage parity
        id: real-smoke
        run: |
          set -uo pipefail
          status=0
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real sqlite > >(tee real-sqlite-smoke.log) 2>&1 || status=1
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real postgres > >(tee real-postgres-smoke.log) 2>&1 || status=1
          exit "$status"

      - name: Upload real smoke diagnostics
        if: failure() && steps.real-smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-smoke-diagnostics-${{ inputs.candidate_sha || github.sha }}-${{ github.run_attempt }}
          path: |
            real-sqlite-smoke.log
            real-postgres-smoke.log
          if-no-files-found: error

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          limit-severities-for-sarif: true
          version: v0.71.2

      - name: Verify Trivy SARIF
        run: test -s trivy-results.sarif

      - name: Upload Trivy SARIF
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          # Match the established default-branch configuration required by the ruleset.
          category: .github/workflows/publish.yml:container

      - name: Trivy PR gate
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          command -v trivy >/dev/null
          trivy image \
            --exit-code 1 \
            --exit-on-eol 1 \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            "${SOURCE_IMAGE}"
