name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Semgrep digest
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0"
          docker pull "$SEMGREP_IMAGE"
          docker image inspect "$SEMGREP_IMAGE" --format='{{range .RepoDigests}}{{println .}}{{end}}'

      - name: Dependency audit diagnostics
        run: npm audit --audit-level=moderate || true

      - name: Auto-fix before gates
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          npm run fix
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply automated fixes"
            git push
          fi

      - run: npm run format:check
      - run: npm run lint

      - name: OpenAPI contract
        id: openapi-lint
        run: |
          set -o pipefail
          npm run openapi:lint 2>&1 | tee openapi-lint.log

      - name: Upload OpenAPI diagnostics
        if: failure() && steps.openapi-lint.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-lint-diagnostics
          path: openapi-lint.log
          if-no-files-found: error

      - name: Tests and coverage
        run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run security:audit

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Semgrep
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0"
          docker pull "$SEMGREP_IMAGE"
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --config auto --error

      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile

      - name: Docker build
        run: docker build -t hindsight-memory-router:ci .

      - name: Fake Hindsight compose smoke
        id: fake-smoke
        run: |
          set -o pipefail
          bash tests/integration/smoke.sh fake 2>&1 | tee fake-smoke.log

      - name: Upload fake smoke diagnostics
        if: failure() && steps.fake-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fake-smoke-diagnostics
          path: fake-smoke.log
          if-no-files-found: error

      - name: Real Hindsight compose smoke
        id: real-smoke
        run: |
          set -o pipefail
          bash tests/integration/smoke.sh real 2>&1 | tee real-smoke.log

      - name: Upload real smoke diagnostics
        if: failure() && steps.real-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-smoke-diagnostics
          path: real-smoke.log
          if-no-files-found: error

  aislop:
    name: aislop status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aislop quality gate
        run: npm run aislop:ci:human

      - name: Aislop SARIF
        if: always()
        run: npm run aislop:ci:sarif > aislop.sarif

      - name: Upload Aislop SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: aislop.sarif
