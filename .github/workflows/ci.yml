name: ci

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The required `aislop status` gate runs in aislop.yml on PRs and through publish.yml on main.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - run: python -m pip install 'pip==26.1.2'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[dev]'

      - name: Python runtime lock is current
        run: |
          cp requirements.txt requirements.expected.txt
          pip-compile --generate-hashes --strip-extras --no-header --no-annotate \
            --output-file requirements.txt pyproject.toml
          diff -u requirements.expected.txt requirements.txt

      - run: npm ci
      - run: npm ci --prefix ui

      - name: UI unit, crypto, and build checks
        run: npm test --prefix ui && npm run build --prefix ui

      - name: Install Playwright Chromium
        run: npx --prefix ui playwright install --with-deps chromium

      - name: UI browser tests
        run: npm run test:e2e --prefix ui

      - name: No legacy TypeScript runtime or tests
        run: |
          set -euo pipefail
          for path in src tsconfig.json vitest.config.ts eslint.config.js; do
            if [ -e "$path" ]; then
              echo "obsolete TypeScript artifact remains: $path" >&2
              exit 1
            fi
          done
          if find tests -type f \( -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .; then
            echo "obsolete TypeScript test remains under tests/" >&2
            find tests -type f \( -name '*.ts' -o -name '*.tsx' \) -print >&2
            exit 1
          fi

      - name: Checkout current Hindsight OpenClaw sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vectorize-io/hindsight
          ref: main
          path: .upstream/hindsight
          persist-credentials: false

      - name: OpenClaw compatibility inventory
        run: python scripts/check_openclaw_compat.py .upstream/hindsight

      - name: Unicode confusables map is reproducible
        run: |
          cp memory_router/confusables_ascii.json /tmp/confusables_ascii.expected.json
          python scripts/generate_confusables_ascii.py
          diff -u /tmp/confusables_ascii.expected.json memory_router/confusables_ascii.json

      - run: ruff format --diff memory_router tests
      - run: ruff check memory_router tests
      - run: mypy memory_router

      - name: OpenAPI contract
        id: openapi-lint
        run: |
          set -o pipefail
          npm run openapi:lint 2>&1 | tee openapi-lint.log

      - name: Upload OpenAPI diagnostics
        if: failure() && steps.openapi-lint.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-lint-diagnostics
          path: openapi-lint.log
          if-no-files-found: error

      - name: Tests and coverage
        run: coverage run -m pytest && coverage report --fail-under=90

      - name: Python dependency audit
        run: pip-audit -r requirements.txt

      - name: Bandit
        run: bandit -q -r memory_router

      - name: Node tooling audit
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix ui --audit-level=moderate

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Semgrep
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b"
          docker pull "$SEMGREP_IMAGE"
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --config .semgrep.yml --exclude .semgrep.yml --error

      - name: Hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

  container:
    name: container
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SOURCE_IMAGE: hindsight-memory-router:ci
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ env.SOURCE_IMAGE }}

      - name: Default Compose smoke
        run: bash tests/integration/default-compose-smoke.sh

      - name: Fake Hindsight router-storage parity
        id: fake-smoke
        run: |
          set -uo pipefail
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake sqlite > >(tee fake-sqlite-smoke.log) 2>&1 &
          sqlite_pid=$!
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake postgres > >(tee fake-postgres-smoke.log) 2>&1 &
          postgres_pid=$!
          status=0
          wait "$sqlite_pid" || status=1
          wait "$postgres_pid" || status=1
          exit "$status"

      - name: Upload fake smoke diagnostics
        if: failure() && steps.fake-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fake-smoke-diagnostics
          path: |
            fake-sqlite-smoke.log
            fake-postgres-smoke.log
          if-no-files-found: error

      - name: Real Hindsight router-storage parity
        id: real-smoke
        run: |
          set -uo pipefail
          status=0
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real sqlite > >(tee real-sqlite-smoke.log) 2>&1 || status=1
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real postgres > >(tee real-postgres-smoke.log) 2>&1 || status=1
          exit "$status"

      - name: Upload real smoke diagnostics
        if: failure() && steps.real-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-smoke-diagnostics
          path: |
            real-sqlite-smoke.log
            real-postgres-smoke.log
          if-no-files-found: error

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          limit-severities-for-sarif: true
          version: v0.71.2

      - name: Verify Trivy SARIF
        run: test -s trivy-results.sarif

      - name: Upload Trivy SARIF
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-results.sarif
          # Match the established default-branch configuration required by the ruleset.
          category: .github/workflows/publish.yml:container

      - name: Trivy PR gate
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          command -v trivy >/dev/null
          trivy image \
            --exit-code 1 \
            --exit-on-eol 1 \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            "${SOURCE_IMAGE}"
