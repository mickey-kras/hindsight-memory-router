name: codeql

on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        default: ''
      candidate_ref:
        type: string
        default: ''
  schedule:
    - cron: "31 3 * * 1"

concurrency:
  group: codeql-${{ github.event_name }}-${{ inputs.candidate_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: .github/workflows/publish.yml:analyze
          ref: ${{ inputs.candidate_ref }}
          sha: ${{ inputs.candidate_sha }}
