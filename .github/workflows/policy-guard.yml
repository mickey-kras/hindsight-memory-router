name: policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PR policy-sensitive files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const wfDir = ['.github', 'workflows'].join('/');
            const publishPath = [wfDir, 'publish.yml'].join('/');
            const ciPath = [wfDir, 'ci.yml'].join('/');
            const codeqlPath = [wfDir, 'codeql.yml'].join('/');
            const aislopPath = [wfDir, 'aislop.yml'].join('/');
            const failureReporterPath = ['.github', 'scripts', 'upsert-main-failure-issue.sh'].join('/');
            const packagePath = 'package.json';
            const checkoutAction = ['actions', 'checkout'].join('/');
            const privilegedWriteKeys = [
              'id-token',
              'packages',
              'attestations',
              'issues',
            ];
            const headTerms = [
              ['github.event.pull_request', 'head'].join('.'),
              ['github', 'head_ref'].join('.'),
              ['head', 'sha'].join('.'),
              ['pull_request', 'head'].join('.'),
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const changed = new Set(
              files.flatMap((file) =>
                file.previous_filename
                  ? [file.filename, file.previous_filename]
                  : [file.filename],
              ),
            );
            const removedOrRenamed = new Set(
              files.flatMap((file) => {
                if (file.status === 'removed') return [file.filename];
                if (file.status === 'renamed' && file.previous_filename) {
                  return [file.previous_filename];
                }
                return [];
              }),
            );
            const workflowChanged = [...changed].some(
              (path) =>
                path.startsWith(`${wfDir}/`) &&
                (path.endsWith('.yml') || path.endsWith('.yaml')),
            );
            const policySensitiveChanged =
              workflowChanged || changed.has(packagePath) || changed.has(failureReporterPath);
            const failures = [];

            async function readFileAtHead(path) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: headSha,
              });
              const data = response.data;
              if (!('content' in data)) return '';
              return Buffer.from(data.content, data.encoding || 'base64').toString('utf8');
            }

            function fail(message) {
              failures.push(message);
            }

            function stripYamlBlockScalars(content) {
              const lines = content.split('\n');
              const kept = [];
              for (let i = 0; i < lines.length; i += 1) {
                const line = lines[i];
                kept.push(line);

                const block = line.match(/^(\s*)(?:-\s*)?[A-Za-z0-9_-]+:\s*[>|]/);
                if (!block) continue;

                const parentIndent = block[1].length;
                while (i + 1 < lines.length) {
                  const next = lines[i + 1];
                  const nextIndent = next.match(/^\s*/)[0].length;
                  if (next.trim() === '' || nextIndent > parentIndent) {
                    i += 1;
                    continue;
                  }
                  break;
                }
              }
              return kept.join('\n');
            }

            function yamlSurface(content) {
              return stripYamlBlockScalars(content)
                .split('\n')
                .filter((line) => !line.trimStart().startsWith('#'))
                .join('\n');
            }

            function hasYamlKey(content, key) {
              const escaped = key.replace(/[.*+?^\${}()|[\]\\]/g, '\\$&');
              return new RegExp(`^\\s*["']?${escaped}["']?\\s*:`, 'm').test(yamlSurface(content));
            }

            function escapeRegex(value) {
              return value.replace(/[.*+?^$()|[\]\\{}]/g, '\\$&');
            }

            function hasYamlScalar(content, key, value) {
              const escapedKey = escapeRegex(key);
              const escapedValue = escapeRegex(value);
              return new RegExp(
                `(?:^|[,{])\\s*["']?${escapedKey}["']?\\s*:\\s*["']?${escapedValue}["']?\\s*(?=$|[,}#])`,
                'im',
              ).test(yamlSurface(content));
            }

            function hasYamlEvent(content, event) {
              if (hasYamlKey(content, event)) return true;

              const escaped = escapeRegex(event);
              const eventToken = new RegExp(`^["']?${escaped}["']?$`, 'i');
              for (const line of yamlSurface(content).split('\n')) {
                const match = line.match(/^\s*["']?on["']?\s*:\s*(.*?)\s*(?:#.*)?$/i);
                if (!match) continue;

                const value = match[1].trim();
                if (eventToken.test(value)) return true;
                if (value.startsWith('[') && value.endsWith(']')) {
                  return value
                    .slice(1, -1)
                    .split(',')
                    .some((item) => eventToken.test(item.trim()));
                }
                if (value.startsWith('{') && value.endsWith('}')) {
                  return value
                    .slice(1, -1)
                    .split(',')
                    .some((item) => eventToken.test(item.split(':', 1)[0].trim()));
                }
              }
              return false;
            }

            function unpinnedActions(content) {
              return yamlSurface(content)
                .split('\n')
                .map((line) => line.match(/^\s*(?:-\s*)?uses:\s*([^\s#]+)/)?.[1])
                .filter((value) => value && !value.startsWith('./'))
                .filter((value) => !/@[0-9a-f]{40}$/i.test(value));
            }

            if (!policySensitiveChanged) {
              core.info('No workflow or Aislop script policy files changed. Policy guard passed.');
              return;
            }

            for (const file of files) {
              const path = file.filename;
              if (!path.startsWith(`${wfDir}/`)) continue;
              if (!path.endsWith('.yml') && !path.endsWith('.yaml')) continue;
              if (file.status === 'removed') continue;

              const content = await readFileAtHead(path);
              const surface = yamlSurface(content);
              const lower = surface.toLowerCase();

              if (hasYamlScalar(content, 'permissions', 'write-all')) {
                fail(`${path}: broad write permissions are not allowed`);
              }

              if (hasYamlEvent(content, 'pull_request_target') && lower.includes(checkoutAction)) {
                if (headTerms.some((term) => lower.includes(term))) {
                  fail(`${path}: trusted PR workflows must not checkout contributor head code`);
                }
              }

              const privileged = privilegedWriteKeys.filter((permission) =>
                hasYamlScalar(content, permission, 'write'),
              );
              const ciSonarOidc =
                path === ciPath &&
                privileged.length === 1 &&
                privileged[0] === 'id-token';
              if (privileged.length > 0 && path !== publishPath && !ciSonarOidc) {
                fail(`${path}: privileged write permissions are only allowed in publish.yml`);
              }
              if (privileged.length > 0 && hasYamlEvent(content, 'pull_request') && !ciSonarOidc) {
                fail(`${path}: pull request workflows must not have privileged write permissions`);
              }

              const unpinned = unpinnedActions(content);
              if (unpinned.length > 0) {
                fail(`${path}: actions must use full commit SHAs: ${unpinned.join(', ')}`);
              }
            }

            if (changed.has(publishPath)) {
              if (removedOrRenamed.has(publishPath)) {
                fail('publish.yml: protected workflow must not be removed or renamed');
              } else {
                const publish = await readFileAtHead(publishPath);
                if (hasYamlEvent(publish, 'pull_request')) {
                  fail('publish.yml: privileged workflow must not run on pull requests');
                }
                if (!hasYamlEvent(publish, 'push')) {
                  fail('publish.yml: trusted push trigger must stay enabled');
                }
                if (!/^  publish:\s*$/m.test(publish)) {
                  fail('publish.yml: real publish job must stay present');
                }
                if (!publish.includes('Trivy critical gate')) {
                  fail('publish.yml: Trivy critical gate must stay present');
                }
                if (!publish.includes('ignore-unfixed: true')) {
                  fail('publish.yml: Trivy gate must ignore unfixed vulnerabilities');
                }
                if (!publish.includes('category: .github/workflows/publish.yml:container')) {
                  fail('publish.yml: Trivy SARIF must preserve the required analysis configuration');
                }
                if (!publish.includes('uses: ./.github/workflows/aislop.yml')) {
                  fail('publish.yml: main validation must call the Aislop gate');
                }
                if (!publish.includes('needs.aislop.result == \'success\'')) {
                  fail('publish.yml: publishing must require a successful Aislop gate');
                }
                if (!/^  report-validation-failure:\s*$/m.test(publish)) {
                  fail('publish.yml: validation failure reporter must stay present');
                }
                if (!publish.includes("needs.aislop.result != 'success'")) {
                  fail('publish.yml: non-successful Aislop validation must be reported');
                }
                if (!publish.includes('bash .github/scripts/upsert-main-failure-issue.sh')) {
                  fail('publish.yml: failure issues must use the deduplicating reporter');
                }
              }
            }

            if (changed.has(failureReporterPath)) {
              if (removedOrRenamed.has(failureReporterPath)) {
                fail('upsert-main-failure-issue.sh: protected reporter must not be removed or renamed');
              } else {
                const reporter = await readFileAtHead(failureReporterPath);
                if (!reporter.includes('gh issue list --state all')) {
                  fail('upsert-main-failure-issue.sh: reporter must search open and closed issues');
                }
                if (!reporter.includes('gh issue reopen')) {
                  fail('upsert-main-failure-issue.sh: reporter must reopen matching closed issues');
                }
                if (!reporter.includes('main-failure:${FAILURE_KEY}')) {
                  fail('upsert-main-failure-issue.sh: reporter must preserve stable failure keys');
                }
              }
            }

            if (changed.has(ciPath)) {
              if (removedOrRenamed.has(ciPath)) {
                fail('ci.yml: protected workflow must not be removed or renamed');
              } else {
                const ci = await readFileAtHead(ciPath);
                if (!ci.includes('name: ci')) fail('ci.yml: workflow name must remain ci');
                if (!ci.includes('checks:')) fail('ci.yml: required checks job must stay present');
                if (!ci.includes('Gitleaks')) fail('ci.yml: Gitleaks step must stay present');
                if (!ci.includes('Semgrep')) fail('ci.yml: Semgrep step must stay present');
                if (!ci.includes('Hadolint')) fail('ci.yml: Hadolint step must stay present');
                if (!ci.includes('name: SonarQube quality gate')) {
                  fail('ci.yml: SonarQube PR and main quality gate must stay present');
                }
                if (!ci.includes('-Dsonar.pullrequest.key=')) {
                  fail('ci.yml: SonarQube PR analysis must stay isolated from the main branch analysis');
                }
                if (!ci.includes('-Dsonar.projectVersion=')) {
                  fail('ci.yml: SonarQube main analysis must advance the previous-version baseline');
                }
                if (!ci.includes("github.event.pull_request.head.repo.full_name == github.repository")) {
                  fail('ci.yml: SonarQube secrets must stay unavailable to fork PRs');
                }
                if (!/^  container:\s*$/m.test(ci)) {
                  fail('ci.yml: required container PR job must stay present');
                }
                if (!ci.includes("if: github.event_name == 'pull_request'")) {
                  fail('ci.yml: container job must stay restricted to pull requests');
                }
                if (!ci.includes('Default Compose smoke')) {
                  fail('ci.yml: default Compose smoke must stay present');
                }
                if (!ci.includes('Fake Hindsight router-storage parity')) {
                  fail('ci.yml: fake smoke gate must stay present');
                }
                if (!ci.includes('Real Hindsight router-storage parity')) {
                  fail('ci.yml: real smoke gate must stay present');
                }
                if (!ci.includes('Trivy PR gate')) {
                  fail('ci.yml: Trivy PR gate must stay present');
                }
                if (!ci.includes('category: .github/workflows/publish.yml:container')) {
                  fail('ci.yml: Trivy SARIF must preserve the required default-branch configuration');
                }
              }
            }

            if (changed.has(aislopPath)) {
              if (removedOrRenamed.has(aislopPath)) {
                fail('aislop.yml: protected workflow must not be removed or renamed');
              } else {
                const aislop = await readFileAtHead(aislopPath);
                if (!aislop.includes('name: aislop')) fail('aislop.yml: workflow name must remain aislop');
                if (!aislop.includes('name: aislop status')) {
                  fail('aislop.yml: required aislop status job must stay present');
                }
                if (!aislop.includes('npm run aislop:ci:human')) {
                  fail('aislop.yml: quality gate must stay present');
                }
                if (!aislop.includes('npm run --silent aislop:ci:sarif')) {
                  fail('aislop.yml: main SARIF generation must stay present');
                }
                if (!aislop.includes('npm run --silent aislop:ci -- --sarif')) {
                  fail('aislop.yml: PR SARIF generation must stay present');
                }
                if (!hasYamlScalar(aislop, 'category', '.github/workflows/publish.yml:status')) {
                  fail('aislop.yml: SARIF must preserve the default-branch configuration');
                }
                if (!aislop.includes('name: Aislop findings gate')) {
                  fail('aislop.yml: zero-findings gate must stay present');
                }
                if (!aislop.includes('process.exit(1)')) {
                  fail('aislop.yml: findings gate must fail the job');
                }
                if (!aislop.includes('pull_request:')) {
                  fail('aislop.yml: pull request gate must stay enabled');
                }
                if (!aislop.includes('workflow_call:')) {
                  fail('aislop.yml: main reusable gate must stay enabled');
                }
              }
            }

            if (changed.has(aislopPath) || changed.has(packagePath)) {
              if (removedOrRenamed.has(packagePath)) {
                fail('package.json: protected Aislop script configuration must not be removed');
              } else {
                const packageJson = JSON.parse(await readFileAtHead(packagePath));
                if (packageJson.scripts?.['aislop:ci'] !== 'aislop ci') {
                  fail('package.json: aislop:ci must remain a full-repository scan');
                }
              }
            }

            if (changed.has(codeqlPath)) {
              if (removedOrRenamed.has(codeqlPath)) {
                fail('codeql.yml: protected workflow must not be removed or renamed');
              } else {
                const codeql = await readFileAtHead(codeqlPath);
                if (!codeql.includes('name: codeql')) fail('codeql.yml: workflow name must remain codeql');
                if (!codeql.includes('analyze:')) fail('codeql.yml: required analyze job must stay present');
                if (!codeql.includes('github/codeql-action/analyze')) {
                  fail('codeql.yml: CodeQL analyze action must stay present');
                }
                if (!hasYamlScalar(codeql, 'category', '.github/workflows/publish.yml:analyze')) {
                  fail('codeql.yml: analysis must preserve the default-branch configuration');
                }
              }
            }

            if (failures.length > 0) {
              core.setFailed(`Policy guard failed:\n- ${failures.join('\n- ')}`);
            } else {
              core.info('Policy guard passed.');
            }
