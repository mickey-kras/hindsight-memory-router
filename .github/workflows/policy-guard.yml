name: policy

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PR policy-sensitive files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const wfDir = ['.github', 'workflows'].join('/');
            const publishPath = [wfDir, 'publish.yml'].join('/');
            const releasePath = [wfDir, 'release.yml'].join('/');
            // Reviewed release workflows and helpers. Pin refreshes (including
            // trailing version comments on uses lines) preserve workflow shape.
            const releaseProtected = {
              ".github/workflows/dependency-review.yml": "0b87abc672ea46903ff062c35a11fc0ac35005678e8d3757b829392d063fb314",
              ".github/dependency-review-config.yml": "f92f128addcb10acd3d874579771b0d44675a3db4809d5c274211c4f0bb9374f",
              ".github/scripts/pr-branch-updater.cjs": "fadcbf9a09c8fb44a64c3b5a876dfb00aa1e9ab3e13e326a99c2ef1bb8274e59",
              ".github/workflows/pr-branch-updater.yml": "b01f1ae6071f3c7b68e067bb92fd85d85be5bcbfa43519005497474638951966",
              ".github/scripts/package.json": ["5d9048ba18038b031d0f1a2d38f8c2b2dafe774ad2d147fe9f97cc951a0d373d", "75f13119ae2a3706a259e1795784d8ddd81c333eb14e6d8290efbc9532f9ed45"],
              ".github/scripts/package-lock.json": ["e9845e680c96ac80042a2240ca2c331043c90dc891f3daea6bfeb3088c82ff7b", "6d50bac913fcf940647ca467a98746279a5893750c2771e8787e858fc7d80077"],
              ".github/scripts/release.cjs": "4866a1d152fdfff74a204d52425351d4e87c2620f7dea7de149685659781df77",
              ".github/scripts/provenance.cjs": "46a0cbdad205a0f6c69142021789d528c803dda013acdc6f6b7de544fc471b23",
              ".github/scripts/provenance.test.cjs": "5c157020e6179cf2dd200309849e6747d521297cc6ff29e6d29612782d12007c",
              ".github/scripts/attest-image.cjs": "1dcf6b08295790a632612a00ba71c3dd7613de027ad873054cb519e07c828e76",
              ".github/scripts/attest-image.test.cjs": "813d0547db9b1bb32a143219cb51807d29e6257aedacecf454af4929300dd27c",
              ".github/scripts/attestation-smoke.sh": "782a95edbd2b0ef27cc945acfac5d3256b16cdb83686ac5e8f8fe7a5946338cc",
              ".github/scripts/release-settings.cjs": "e485de848409942ca37d32a4caea8a93cd4bac5e93048e7b24bf57d848372a57",
              ".github/scripts/release.test.cjs": "84ce8d78fced264869dbf67eb0e6b15b1f9c9d384bb3d87c1c9135e9fdb89b9b",
              ".github/scripts/release-cleanup.cjs": "c878f1e64990c498aa27b2fbb3a485574245a4b78c2ffed7880415714373ad22",
              ".github/scripts/release-cleanup.test.cjs": "d88923e9d5f6f4293a52dc78de338097f7898043317c4cb42cad30498b81b803",
              ".github/scripts/release-policy.test.py": "c4d7ac44e0255436be2702a8afc496cb9e46e79abd4a3de52ca3bb0ad351979f",
              ".github/scripts/aislop-cli.test.cjs": "8a37cf4335ab7762b86a73bfb7961bf649d6745be3d0ff92b9287f7d1946d6b6",
              ".github/rulesets/protect-release-branches.json": "b3ccb6d485283c3f83c4e39939c38543808c63225f1f419295156b72700a06d7",
              ".github/scripts/publish-image.sh": "eabbfb7c05465cbb0a46eee13ec54a51dd6e6f5c46126a6d443eeef948a9fd7b",
              ".github/scripts/publish-image.test.cjs": "bac26ea2f4a54f2a455445fee9e96d8503aabb89e226b82f9eadf551c198350c",
              ".github/workflows/publish.yml": "8e39c51895e8c75a8e868ebdf3a9ac4026cd9bb228da0f41ccce1068b8ac770d",
              ".github/workflows/release.yml": "1c0f53465d44deaeeced2158c3dd668ca0e625acf51212357be597ffaed0094c",
              ".github/workflows/ci.yml": "266d27116c5f297922df75455c1751b23ce63ddd4e16e5c53ddc7ac66a314df1",
              ".github/workflows/aislop.yml": "0ecc80af57e081678cb78f6c088eb9f89f10b497d7c8105b4b74b88a0ce9a724",
              ".github/workflows/codeql.yml": "16ec8bb6cfbf41ea2146bff1a1637d6c49b6b7627212fbef1d8ebad741679654",
              ".github/workflows/architecture.yml": "5204bbf4fbc12302cc4160aea78d4cedb1a812b9c45e775bdd793cd39757698e",
              ".github/scripts/report-main-failures.cjs": "652f29115b78eee5f7b56a8043cddda94e9cf7e74cb8559d1398a5c972697222",
              ".github/scripts/report-main-failures.test.cjs": "a0aee72db3ad204e59882a7f8732fa896557f344fdd1eb91ae40336de5cb4c7d"
            };
            const prValidationPath = [wfDir, 'pr-validation.yml'].join('/');
            const ciPath = [wfDir, 'ci.yml'].join('/');
            const codeqlPath = [wfDir, 'codeql.yml'].join('/');
            const aislopPath = [wfDir, 'aislop.yml'].join('/');
            const dependabotWorkflowPath = [wfDir, 'dependabot-auto-merge.yml'].join('/');
            const dependabotScriptPath = ['.github', 'scripts', 'dependabot-auto-merge.cjs'].join('/');
            const failureReporterPath = ['.github', 'scripts', 'upsert-main-failure-issue.sh'].join('/');
            const sonarReporterPath = ['.github', 'scripts', 'sync-sonar-findings.py'].join('/');
            const packagePath = 'package.json';
            const checkoutAction = ['actions', 'checkout'].join('/');
            const privilegedWriteKeys = [
              'id-token',
              'packages',
              'attestations',
              'issues',
            ];
            const headTerms = [
              ['github.event.pull_request', 'head'].join('.'),
              ['github', 'head_ref'].join('.'),
              ['head', 'sha'].join('.'),
              ['pull_request', 'head'].join('.'),
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const changed = new Set(
              files.flatMap((file) =>
                file.previous_filename
                  ? [file.filename, file.previous_filename]
                  : [file.filename],
              ),
            );
            const removedOrRenamed = new Set(
              files.flatMap((file) => {
                if (file.status === 'removed') return [file.filename];
                if (file.status === 'renamed' && file.previous_filename) {
                  return [file.previous_filename];
                }
                return [];
              }),
            );
            const workflowChanged = [...changed].some(
              (path) =>
                path.startsWith(`${wfDir}/`) &&
                (path.endsWith('.yml') || path.endsWith('.yaml')),
            );
            const policySensitiveChanged =
              workflowChanged || changed.has(packagePath) || changed.has(failureReporterPath) ||
              changed.has(dependabotScriptPath) || Object.keys(releaseProtected).some(path => changed.has(path));
            const failures = [];

            async function readFileAtHead(path) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: headSha,
              });
              const data = response.data;
              if (!('content' in data)) return '';
              return Buffer.from(data.content, data.encoding || 'base64').toString('utf8');
            }

            function fail(message) {
              failures.push(message);
            }

            function stripYamlBlockScalars(content) {
              const lines = content.split('\n');
              const kept = [];
              for (let i = 0; i < lines.length; i += 1) {
                const line = lines[i];
                kept.push(line);

                const block = line.match(/^(\s*)(?:-\s*)?[A-Za-z0-9_-]+:\s*[>|]/);
                if (!block) continue;

                const parentIndent = block[1].length;
                while (i + 1 < lines.length) {
                  const next = lines[i + 1];
                  const nextIndent = next.match(/^\s*/)[0].length;
                  if (next.trim() === '' || nextIndent > parentIndent) {
                    i += 1;
                    continue;
                  }
                  break;
                }
              }
              return kept.join('\n');
            }

            function yamlSurface(content) {
              return stripYamlBlockScalars(content)
                .split('\n')
                .filter((line) => !line.trimStart().startsWith('#'))
                .join('\n');
            }

            function hasYamlKey(content, key) {
              const escaped = key.replace(/[.*+?^\${}()|[\]\\]/g, '\\$&');
              return new RegExp(`^\\s*["']?${escaped}["']?\\s*:`, 'm').test(yamlSurface(content));
            }

            function escapeRegex(value) {
              return value.replace(/[.*+?^$()|[\]\\{}]/g, '\\$&');
            }

            function hasYamlScalar(content, key, value) {
              const escapedKey = escapeRegex(key);
              const escapedValue = escapeRegex(value);
              return new RegExp(
                `(?:^|[,{])\\s*["']?${escapedKey}["']?\\s*:\\s*["']?${escapedValue}["']?\\s*(?=$|[,}#])`,
                'im',
              ).test(yamlSurface(content));
            }

            function hasYamlEvent(content, event) {
              if (hasYamlKey(content, event)) return true;

              const escaped = escapeRegex(event);
              const eventToken = new RegExp(`^["']?${escaped}["']?$`, 'i');
              for (const line of yamlSurface(content).split('\n')) {
                const match = line.match(/^\s*["']?on["']?\s*:\s*(.*?)\s*(?:#.*)?$/i);
                if (!match) continue;

                const value = match[1].trim();
                if (eventToken.test(value)) return true;
                if (value.startsWith('[') && value.endsWith(']')) {
                  return value
                    .slice(1, -1)
                    .split(',')
                    .some((item) => eventToken.test(item.trim()));
                }
                if (value.startsWith('{') && value.endsWith('}')) {
                  return value
                    .slice(1, -1)
                    .split(',')
                    .some((item) => eventToken.test(item.split(':', 1)[0].trim()));
                }
              }
              return false;
            }

            function unpinnedActions(content) {
              return yamlSurface(content)
                .split('\n')
                .map((line) => line.match(/^\s*(?:-\s*)?uses:\s*([^\s#]+)/)?.[1])
                .filter((value) => value && !value.startsWith('./'))
                .filter((value) => !/@[0-9a-f]{40}$/i.test(value));
            }

            if (!policySensitiveChanged) {
              core.info('No workflow or Aislop script policy files changed. Policy guard passed.');
              return;
            }

            for (const file of files) {
              const path = file.filename;
              if (!path.startsWith(`${wfDir}/`)) continue;
              if (!path.endsWith('.yml') && !path.endsWith('.yaml')) continue;
              if (file.status === 'removed') continue;

              const content = await readFileAtHead(path);
              const surface = yamlSurface(content);
              const lower = surface.toLowerCase();

              if (hasYamlScalar(content, 'permissions', 'write-all')) {
                fail(`${path}: broad write permissions are not allowed`);
              }

              if (hasYamlEvent(content, 'pull_request_target') && lower.includes(checkoutAction)) {
                if (headTerms.some((term) => lower.includes(term))) {
                  fail(`${path}: trusted PR workflows must not checkout contributor head code`);
                }
              }

              const privileged = privilegedWriteKeys.filter((permission) =>
                hasYamlScalar(content, permission, 'write'),
              );
              if (privileged.length > 0 && ![publishPath, releasePath, dependabotWorkflowPath].includes(path)) {
                fail(`${path}: privileged write permissions are only allowed in trusted workflows`);
              }
              if (privileged.length > 0 && hasYamlEvent(content, 'pull_request')) {
                fail(`${path}: pull request workflows must not have privileged write permissions`);
              }

              const unpinned = unpinnedActions(content);
              if (unpinned.length > 0) {
                fail(`${path}: actions must use full commit SHAs: ${unpinned.join(', ')}`);
              }
            }

            for (const [path, expected] of Object.entries(releaseProtected)) {
              if (!changed.has(path)) continue;
              if (removedOrRenamed.has(path)) {
                fail(`${path}: protected release automation must not be removed`);
                continue;
              }
              const raw = await readFileAtHead(path);
              const content = path.endsWith('.yml') ? raw.replace(/(uses:\s*[^\s@]+)@[a-f0-9]{40}[^\n]*/g, '$1@PINNED') : raw;
              const digest = require('node:crypto').createHash('sha256').update(content).digest('hex');
              if (!(Array.isArray(expected) ? expected : [expected]).includes(digest)) fail(`${path}: release automation must match its reviewed policy`);
            }

            if (changed.has(publishPath)) {
              if (removedOrRenamed.has(publishPath)) {
                fail('publish.yml: protected workflow must not be removed or renamed');
              } else {
                const publish = await readFileAtHead(publishPath);
                if (hasYamlEvent(publish, 'pull_request')) {
                  fail('publish.yml: privileged workflow must not run on pull requests');
                }
                if (!hasYamlEvent(publish, 'push')) {
                  fail('publish.yml: trusted push trigger must stay enabled');
                }
                if (!/^  publish:\s*$/m.test(publish)) {
                  fail('publish.yml: real publish job must stay present');
                }
                if (!publish.includes('Trivy critical gate')) {
                  fail('publish.yml: Trivy critical gate must stay present');
                }
                if (!publish.includes('ignore-unfixed: true')) {
                  fail('publish.yml: Trivy gate must ignore unfixed vulnerabilities');
                }
                if (!publish.includes('category: .github/workflows/publish.yml:container')) {
                  fail('publish.yml: Trivy SARIF must preserve the required analysis configuration');
                }
                if (!publish.includes('uses: ./.github/workflows/aislop.yml')) {
                  fail('publish.yml: main validation must call the Aislop gate');
                }
                if (!publish.includes('needs.aislop.result == \'success\'')) {
                  fail('publish.yml: publishing must require a successful Aislop gate');
                }
                if (!/^  report-validation-failure:\s*$/m.test(publish)) {
                  fail('publish.yml: validation failure reporter must stay present');
                }
                const reporter = publish.split('  report-validation-failure:')[1]?.split(/\n  [a-z][a-z-]*:/)[0] || '';
                if (!reporter.includes('!cancelled() &&') ||
                    !reporter.includes("needs.aislop.result == 'failure'")) {
                  fail('publish.yml: report failed Aislop validation without continuing cancelled runs');
                }
                if (!publish.includes('bash .github/scripts/upsert-main-failure-issue.sh')) {
                  fail('publish.yml: failure issues must use the deduplicating reporter');
                }
                if (!publish.includes('python .github/scripts/sync-sonar-findings.py')) {
                  fail('publish.yml: SonarQube failures must synchronize actionable findings');
                }
                if (!publish.includes("if: steps.push.outputs.published == 'true'")) {
                  fail('publish.yml: post-publish supply-chain steps must require a published image');
                }
                if (!/^  pages:\s*$/m.test(publish)) {
                  fail('publish.yml: architecture Pages deployment job must stay present');
                }
                if (!publish.includes('actions/deploy-pages@')) {
                  fail('publish.yml: architecture site must deploy through GitHub Pages Actions');
                }
              }
            }

            if (changed.has(dependabotWorkflowPath)) {
              if (removedOrRenamed.has(dependabotWorkflowPath)) {
                fail('dependabot-auto-merge.yml: protected workflow must not be removed or renamed');
              } else {
                const workflow = await readFileAtHead(dependabotWorkflowPath);
                if (!hasYamlEvent(workflow, 'pull_request_target')) {
                  fail('dependabot-auto-merge.yml: trusted PR trigger must stay enabled');
                }
                if (!workflow.includes(['ref: $', '{{ github.workflow_sha }}'].join(''))) {
                  fail('dependabot-auto-merge.yml: automation must load from the trusted workflow revision');
                }
                if (!workflow.includes("github.event.pull_request.user.login == 'dependabot[bot]'")) {
                  fail('dependabot-auto-merge.yml: PR events must remain restricted to Dependabot');
                }
              }
            }

            if (changed.has(dependabotScriptPath)) {
              if (removedOrRenamed.has(dependabotScriptPath)) {
                fail('dependabot-auto-merge.cjs: protected automation must not be removed or renamed');
              } else {
                const automation = await readFileAtHead(dependabotScriptPath);
                const contracts = [
                  'id: 49699333',
                  'verifiedCommits',
                  "'--auto', '--squash', '--match-head-commit'",
                ];
                for (const contract of contracts) {
                  if (!automation.includes(contract)) {
                    fail(`dependabot-auto-merge.cjs: missing safety contract: ${contract}`);
                  }
                }
              }
            }

            if (changed.has(failureReporterPath)) {
              if (removedOrRenamed.has(failureReporterPath)) {
                fail('upsert-main-failure-issue.sh: protected reporter must not be removed or renamed');
              } else {
                const reporter = await readFileAtHead(failureReporterPath);
                if (!reporter.includes('gh issue list --state all')) {
                  fail('upsert-main-failure-issue.sh: reporter must search open and closed issues');
                }
                if (!reporter.includes('gh issue reopen')) {
                  fail('upsert-main-failure-issue.sh: reporter must reopen matching closed issues');
                }
                if (!reporter.includes('main-failure:${FAILURE_KEY}')) {
                  fail('upsert-main-failure-issue.sh: reporter must preserve stable failure keys');
                }
              }
            }

            if (changed.has(sonarReporterPath)) {
              if (removedOrRenamed.has(sonarReporterPath)) {
                fail('sync-sonar-findings.py: protected reporter must not be removed or renamed');
              } else {
                const reporter = await readFileAtHead(sonarReporterPath);
                if (!reporter.includes('ISSUE_MARKER_PREFIX = "sonar-finding"')) {
                  fail('sync-sonar-findings.py: stable finding markers must be preserved');
                }
                if (!/self\._run\(\s*"gh",\s*"issue",\s*"list",[\s\S]*?"--state",\s*"all"/m.test(reporter)) {
                  fail('sync-sonar-findings.py: reporter must search open and closed issues');
                }
                if (!/self\._run\(\s*"gh",\s*"issue",\s*"reopen"/m.test(reporter)) {
                  fail('sync-sonar-findings.py: reporter must reopen matching closed issues');
                }
                if (!reporter.includes('sinceLeakPeriod=True')) {
                  fail('sync-sonar-findings.py: hotspots must stay scoped to new code');
                }
              }
            }

            if (changed.has(ciPath)) {
              if (removedOrRenamed.has(ciPath)) {
                fail('ci.yml: protected workflow must not be removed or renamed');
              } else {
                const ci = await readFileAtHead(ciPath);
                if (!ci.includes('name: ci')) fail('ci.yml: workflow name must remain ci');
                if (!ci.includes('checks:')) fail('ci.yml: required checks job must stay present');
                if (!ci.includes('Gitleaks')) fail('ci.yml: Gitleaks step must stay present');
                if (!ci.includes('Semgrep')) fail('ci.yml: Semgrep step must stay present');
                if (!ci.includes('Hadolint')) fail('ci.yml: Hadolint step must stay present');
                if (!ci.includes('pip-audit -r requirements.txt')) {
                  fail('ci.yml: Python dependency audit must stay present');
                }
                if (!ci.includes('node .github/scripts/npm-audit.cjs')) {
                  fail('ci.yml: Node dependency audit must stay present');
                }
                if (!hasYamlScalar(ci, 'run', 'node --test .github/scripts/aislop-cli.test.cjs')) {
                  fail('ci.yml: pinned Aislop CLI regression tests must stay present');
                }
                if (!/^  container:\s*$/m.test(ci)) {
                  fail('ci.yml: required container PR job must stay present');
                }
                if (!ci.includes("if: github.event_name == 'pull_request'")) {
                  fail('ci.yml: container job must stay restricted to pull requests');
                }
                if (!ci.includes('Default Compose smoke')) {
                  fail('ci.yml: default Compose smoke must stay present');
                }
                if (!ci.includes('Fake Hindsight router-storage parity')) {
                  fail('ci.yml: fake smoke gate must stay present');
                }
                if (!ci.includes('Real Hindsight router-storage parity')) {
                  fail('ci.yml: real smoke gate must stay present');
                }
                if (!ci.includes('Trivy PR gate')) {
                  fail('ci.yml: Trivy PR gate must stay present');
                }
                if (!ci.includes('category: .github/workflows/publish.yml:container')) {
                  fail('ci.yml: Trivy SARIF must preserve the required default-branch configuration');
                }
              }
            }

            if (changed.has(prValidationPath)) {
              if (removedOrRenamed.has(prValidationPath)) {
                fail('pr-validation.yml: protected workflow must not be removed or renamed');
              } else {
                const validation = await readFileAtHead(prValidationPath);
                if (!hasYamlEvent(validation, 'pull_request')) {
                  fail('pr-validation.yml: pull request trigger must stay enabled');
                }
                for (const workflow of [
                  'ci.yml',
                  'aislop.yml',
                  'codeql.yml',
                  'policy-guard.yml',
                  'branch-policy.yml',
                  'architecture.yml',
                  'dependabot-policy-tests.yml',
                ]) {
                  if (!validation.includes(`uses: ./.github/workflows/${workflow}`)) {
                    fail(`pr-validation.yml: ${workflow} gate must stay present`);
                  }
                }
              }
            }

            if (changed.has(aislopPath)) {
              if (removedOrRenamed.has(aislopPath)) {
                fail('aislop.yml: protected workflow must not be removed or renamed');
              } else {
                const aislop = await readFileAtHead(aislopPath);
                if (!aislop.includes('name: aislop')) fail('aislop.yml: workflow name must remain aislop');
                if (!aislop.includes('name: aislop status')) {
                  fail('aislop.yml: required aislop status job must stay present');
                }
                if (!hasYamlScalar(aislop, 'run', 'npm run --silent aislop:ci -- --sarif > aislop.sarif')) {
                  fail('aislop.yml: one full-repository SARIF scan must preserve the CLI quality exit status');
                }
                if (!hasYamlScalar(aislop, 'category', '.github/workflows/publish.yml:status')) {
                  fail('aislop.yml: SARIF must preserve the default-branch configuration');
                }
                if (!aislop.includes('name: Aislop findings gate')) {
                  fail('aislop.yml: zero-findings gate must stay present');
                }
                if (!aislop.includes('process.exit(1)')) {
                  fail('aislop.yml: findings gate must fail the job');
                }
                if (!aislop.includes('workflow_call:')) {
                  fail('aislop.yml: reusable gate must stay enabled');
                }
              }
            }

            if (changed.has(aislopPath) || changed.has(packagePath)) {
              if (removedOrRenamed.has(packagePath)) {
                fail('package.json: protected Aislop script configuration must not be removed');
              } else {
                const packageJson = JSON.parse(await readFileAtHead(packagePath));
                if (packageJson.scripts?.['aislop:ci'] !== 'aislop ci') {
                  fail('package.json: aislop:ci must remain a full-repository scan');
                }
              }
            }

            if (changed.has(codeqlPath)) {
              if (removedOrRenamed.has(codeqlPath)) {
                fail('codeql.yml: protected workflow must not be removed or renamed');
              } else {
                const codeql = await readFileAtHead(codeqlPath);
                if (!codeql.includes('name: codeql')) fail('codeql.yml: workflow name must remain codeql');
                if (!codeql.includes('analyze:')) fail('codeql.yml: required analyze job must stay present');
                if (!codeql.includes('github/codeql-action/analyze')) {
                  fail('codeql.yml: CodeQL analyze action must stay present');
                }
                if (!hasYamlScalar(codeql, 'category', '.github/workflows/publish.yml:analyze')) {
                  fail('codeql.yml: analysis must preserve the default-branch configuration');
                }
              }
            }

            if (failures.length > 0) {
              core.setFailed(`Policy guard failed:\n- ${failures.join('\n- ')}`);
            } else {
              core.info('Policy guard passed.');
            }
