name: architecture

on:
  pull_request:
    paths:
      - 'docs/architecture/**'
      - 'docs/architecture.md'
      - 'memory_router/**'
      - 'compat/openclaw.json'
      - 'compose.yaml'
      - 'scripts/architecture.sh'
      - 'Makefile'
      - '.github/workflows/architecture.yml'
      - '.github/workflows/architecture-pages.yml'
  workflow_call:

concurrency:
  group: architecture-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Validate and regenerate architecture
        run: make architecture

      - name: Build interactive architecture site
        run: make architecture-site

      - name: Generated architecture is current
        run: |
          git diff --exit-code -- docs/architecture/generated
          untracked="$(git ls-files --others --exclude-standard docs/architecture/generated)"
          if [ -n "$untracked" ]; then
            printf 'Uncommitted generated architecture files:\n%s\n' "$untracked" >&2
            exit 1
          fi

      - name: Upload generated architecture diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-architecture
          path: docs/architecture/generated
          if-no-files-found: error
