name: architecture

on:
  workflow_call:
    inputs:
      validation_only:
        description: Skip the Pages artifact; retain architecture generation, site build, and currentness checks.
        type: boolean
        default: false
      candidate_sha:
        type: string
        default: ''
      candidate_ref:
        type: string
        default: ''
    outputs:
      pages_artifact_name:
        value: ${{ jobs.validate.outputs.pages_artifact_name }}

concurrency:
  group: architecture-${{ github.event_name }}-${{ inputs.candidate_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name: ${{ steps.pages-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Validate and regenerate architecture
        run: make architecture

      - name: Build interactive architecture site
        run: make architecture-site

      - name: Generated architecture is current
        run: |
          git diff --exit-code -- docs/architecture/generated
          untracked="$(git ls-files --others --exclude-standard docs/architecture/generated)"
          if [ -n "$untracked" ]; then
            printf 'Uncommitted generated architecture files:\n%s\n' "$untracked" >&2
            exit 1
          fi

      - name: Name architecture Pages artifact
        id: pages-artifact
        if: inputs.candidate_sha == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !inputs.validation_only
        env:
          PAGES_ARTIFACT: github-pages-${{ github.sha }}-${{ github.run_attempt }}
        run: echo "name=$PAGES_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload architecture Pages artifact
        if: inputs.candidate_sha == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !inputs.validation_only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: .architecture-site

      - name: Upload generated architecture diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-architecture-${{ inputs.candidate_sha || github.sha }}-${{ github.run_attempt }}
          path: docs/architecture/generated
          if-no-files-found: error
