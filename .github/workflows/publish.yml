name: main

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a pinned release branch and automatically release after checks
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: quality
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  update-pr-branches:
    name: update PR branches
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/pr-branch-updater.yml

  aislop:
    name: aislop
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/aislop.yml

  codeql:
    name: codeql
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  architecture:
    name: architecture
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
    uses: ./.github/workflows/architecture.yml

  pages:
    name: pages
    needs: architecture
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy architecture Pages site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish:
    name: validate image and release
    needs: [quality, aislop, codeql, architecture]
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
      needs.quality.result == 'success' && needs.aislop.result == 'success' &&
      needs.codeql.result == 'success' && needs.architecture.result == 'success'
    runs-on: ubuntu-latest
    environment: release-automation
    concurrency:
      group: image-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
      issues: write
    env:
      RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
      HINDSIGHT_TEST_IMAGE: ${{ needs.quality.outputs.hindsight_image }}
      IMAGE_GHCR: ghcr.io/${{ github.repository }}
      IMAGE_DOCKERHUB: docker.io/mickeykrasilnikov/hindsight-memory-router
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Connect to the tailnet
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:github-sonar
          use-cache: 'true'

      - name: Set up Python
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Generate coverage for SonarQube
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          python -m pip install 'pip==26.1.2'
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'
          coverage run -m pytest
          coverage xml

      - name: SonarQube analysis
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        id: sonar-quality-gate
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        timeout-minutes: 6
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        with:
          pollingTimeoutSec: 270
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Release preflight
        if: startsWith(github.ref, 'refs/heads/release/')
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/scripts/release.cjs').validate({ github, context, core });

      - name: Find previously tested image
        if: startsWith(github.ref, 'refs/heads/release/')
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            const artifact = artifacts.find(item => item.name === `image-${context.sha}` && !item.expired);
            core.setOutput('artifact', artifact ? String(artifact.id) : '');

      - name: Restore previously tested image
        if: steps.candidate.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true

      - name: Load previously tested image
        if: steps.candidate.outputs.artifact != ''
        run: |
          docker load --input "$RUNNER_TEMP/candidate/router-image.tar"
          docker tag "$SOURCE_IMAGE" hindsight-memory-router:ci

      - name: Build image once
        if: steps.candidate.outputs.artifact == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.SOURCE_IMAGE }}
            hindsight-memory-router:ci

      - name: Default Compose smoke
        run: bash tests/integration/default-compose-smoke.sh

      - name: Fake Hindsight router-storage parity
        id: fake-smoke
        run: |
          set -uo pipefail
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake sqlite > >(tee fake-sqlite-smoke.log) 2>&1 &
          sqlite_pid=$!
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake postgres > >(tee fake-postgres-smoke.log) 2>&1 &
          postgres_pid=$!
          status=0
          wait "$sqlite_pid" || status=1
          wait "$postgres_pid" || status=1
          exit "$status"

      - name: Upload fake smoke diagnostics
        if: failure() && steps.fake-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fake-smoke-diagnostics
          path: |
            fake-sqlite-smoke.log
            fake-postgres-smoke.log
          if-no-files-found: error

      - name: Real Hindsight router-storage parity
        id: real-smoke
        run: |
          set -uo pipefail
          status=0
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real sqlite > >(tee real-sqlite-smoke.log) 2>&1 || status=1
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real postgres > >(tee real-postgres-smoke.log) 2>&1 || status=1
          exit "$status"

      - name: Upload real smoke diagnostics
        if: failure() && steps.real-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-smoke-diagnostics
          path: |
            real-sqlite-smoke.log
            real-postgres-smoke.log
          if-no-files-found: error

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          limit-severities-for-sarif: true
          version: v0.71.2

      - name: Verify Trivy SARIF
        run: test -s trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/publish.yml:container

      - name: Trivy critical gate
        # Policy contract equivalent: ignore-unfixed: true.
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          command -v trivy >/dev/null
          trivy image \
            --exit-code 1 \
            --exit-on-eol 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${SOURCE_IMAGE}"

      - name: Save tested image
        if: startsWith(github.ref, 'refs/heads/release/') && steps.candidate.outputs.artifact == ''
        run: docker save --output "$RUNNER_TEMP/router-image.tar" "$SOURCE_IMAGE"

      - name: Retain tested image for retries
        if: startsWith(github.ref, 'refs/heads/release/') && steps.candidate.outputs.artifact == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-${{ github.sha }}
          path: ${{ runner.temp }}/router-image.tar
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Recheck release head before publication
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/scripts/release.cjs').validate({ github, context, core });

      - name: Push the scanned image
        if: startsWith(github.ref, 'refs/heads/release/')
        id: push
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/scripts/publish-image.sh

      - name: Install Cosign
        if: steps.push.outputs.published == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        if: steps.push.outputs.published == 'true'
        env:
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
        run: |
          cosign sign --yes "${IMAGE_GHCR}@${GHCR_DIGEST}"
          cosign sign --yes "${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}"

      - name: Attest GHCR image
        if: steps.push.outputs.published == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_GHCR }}
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub image
        if: steps.push.outputs.published == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_DOCKERHUB }}
          subject-digest: ${{ steps.push.outputs.dockerhub_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record image digests
        if: steps.push.outputs.published == 'true'
        env:
          CHANNEL: release
          VERSION: ${{ steps.release.outputs.version }}
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "channel=${CHANNEL}"
            echo "version=${VERSION}"
            echo "ghcr=${IMAGE_GHCR}@${GHCR_DIGEST}"
            echo "dockerhub=${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}"
          } | tee image-digests.txt
          {
            echo "## Published image digests"
            echo
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- \`${IMAGE_GHCR}@${GHCR_DIGEST}\`"
            echo "- \`${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digests
        if: steps.push.outputs.published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ github.sha }}-${{ github.run_attempt }}
          path: image-digests.txt
          if-no-files-found: error

      - name: Release App token
        if: startsWith(github.ref, 'refs/heads/release/')
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish immutable release
        if: steps.push.outputs.published == 'true'
        id: finalized
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: await require('./.github/scripts/release.cjs').finalize({ github, context, core });

      - name: Promote latest released image
        if: steps.finalized.outputs.latest == 'true'
        env:
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_GHCR:latest" "$IMAGE_GHCR@$GHCR_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_DOCKERHUB:latest" "$IMAGE_DOCKERHUB@$DOCKERHUB_DIGEST"

      - name: Synchronize SonarQube findings
        if: failure() && steps.sonar-quality-gate.outcome == 'failure' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python .github/scripts/sync-sonar-findings.py .scannerwork/report-task.txt

  report-validation-failure:
    name: report main failure
    needs: [quality, aislop, codeql, architecture, publish, pages, update-pr-branches]
    if: >-
      ${{
        always() &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main' &&
        (
          needs.quality.result != 'success' ||
          needs.aislop.result != 'success' ||
          needs.codeql.result != 'success' ||
          needs.architecture.result != 'success' ||
          needs.publish.result != 'success' ||
          needs.pages.result != 'success' ||
          needs.update-pr-branches.result != 'success'
        )
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: main-failure-issues-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report each distinct failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/upsert-main-failure-issue.sh

  prepare-release:
    name: create release branch
    needs: [quality, aislop, codeql, architecture, publish]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.create_release
    runs-on: ubuntu-latest
    environment: release-automation
    concurrency:
      group: release-preparation-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Freeze inputs and create release branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: await require('./.github/scripts/release.cjs').prepare({ github, context, core });
