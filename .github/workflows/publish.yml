name: publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  update-pr-branches:
    name: update PR branches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/pr-branch-updater.yml

  aislop:
    name: aislop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/aislop.yml

  codeql:
    name: codeql
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  architecture:
    name: architecture
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/architecture.yml

  pages:
    name: pages
    needs: architecture
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy architecture Pages site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  publish:
    name: publish
    needs: [quality, aislop, codeql, architecture]
    if: >-
      ${{
        always() &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          (
            github.ref == 'refs/heads/main' &&
            needs.quality.result == 'success' &&
            needs.aislop.result == 'success' &&
            needs.codeql.result == 'success' &&
            needs.architecture.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
      issues: write
    env:
      IMAGE_GHCR: ghcr.io/${{ github.repository }}
      IMAGE_DOCKERHUB: docker.io/mickeykrasilnikov/hindsight-memory-router
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Connect to the tailnet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:github-sonar
          use-cache: 'true'

      - name: Set up Python
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Generate coverage for SonarQube
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -m pip install 'pip==26.1.2'
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'
          coverage run -m pytest
          coverage xml

      - name: SonarQube analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        id: sonar-quality-gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 6
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        with:
          pollingTimeoutSec: 270
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          provenance: false
          tags: |
            ${{ env.SOURCE_IMAGE }}
            hindsight-memory-router:ci

      - name: Default Compose smoke
        run: bash tests/integration/default-compose-smoke.sh

      - name: Fake Hindsight router-storage parity
        id: fake-smoke
        run: |
          set -uo pipefail
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake sqlite > >(tee fake-sqlite-smoke.log) 2>&1 &
          sqlite_pid=$!
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake postgres > >(tee fake-postgres-smoke.log) 2>&1 &
          postgres_pid=$!
          status=0
          wait "$sqlite_pid" || status=1
          wait "$postgres_pid" || status=1
          exit "$status"

      - name: Upload fake smoke diagnostics
        if: failure() && steps.fake-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fake-smoke-diagnostics
          path: |
            fake-sqlite-smoke.log
            fake-postgres-smoke.log
          if-no-files-found: error

      - name: Real Hindsight router-storage parity
        id: real-smoke
        run: |
          set -uo pipefail
          status=0
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real sqlite > >(tee real-sqlite-smoke.log) 2>&1 || status=1
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real postgres > >(tee real-postgres-smoke.log) 2>&1 || status=1
          exit "$status"

      - name: Upload real smoke diagnostics
        if: failure() && steps.real-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-smoke-diagnostics
          path: |
            real-sqlite-smoke.log
            real-postgres-smoke.log
          if-no-files-found: error

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          limit-severities-for-sarif: true
          version: v0.71.2

      - name: Verify Trivy SARIF
        run: test -s trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/publish.yml:container

      - name: Trivy critical gate
        # Policy contract equivalent: ignore-unfixed: true.
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          command -v trivy >/dev/null
          trivy image \
            --exit-code 1 \
            --exit-on-eol 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${SOURCE_IMAGE}"

      - name: Select publish tags
        if: github.event_name == 'push'
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/heads/main)
              channel=main
              version=latest
              ghcr_tags="${IMAGE_GHCR}:latest ${IMAGE_GHCR}:${GITHUB_SHA}"
              dockerhub_tags="${IMAGE_DOCKERHUB}:latest ${IMAGE_DOCKERHUB}:${GITHUB_SHA}"
              ;;
            refs/tags/v*)
              version="${GITHUB_REF_NAME}"
              if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
                echo "Invalid release tag: ${version}" >&2
                exit 1
              fi
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "Tag ${version} is not reachable from main." >&2
                exit 1
              fi
              run_ids="$(gh api \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?branch=main&event=push&status=success&head_sha=${GITHUB_SHA}&per_page=100" \
                --jq '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA) | .id')"
              if [[ -z "${run_ids}" ]]; then
                echo "Commit ${GITHUB_SHA} has no successful main publish run." >&2
                exit 1
              fi
              channel=stable-tag
              ghcr_tags="${IMAGE_GHCR}:${version} ${IMAGE_GHCR}:${GITHUB_SHA}"
              dockerhub_tags="${IMAGE_DOCKERHUB}:${version} ${IMAGE_DOCKERHUB}:${GITHUB_SHA}"
              ;;
            *)
              echo "Unsupported publishing ref: ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac

          {
            echo "channel=${channel}"
            echo "version=${version}"
            echo "ghcr_tags=${ghcr_tags}"
            echo "dockerhub_tags=${dockerhub_tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the scanned image
        if: github.event_name == 'push'
        id: push
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          GHCR_TAGS: ${{ steps.release.outputs.ghcr_tags }}
          DOCKERHUB_TAGS: ${{ steps.release.outputs.dockerhub_tags }}
        run: |
          set -euo pipefail

          if [[ "${CHANNEL}" == "main" ]]; then
            git fetch --no-tags origin main
            if [[ "${GITHUB_SHA}" != "$(git rev-parse origin/main)" ]]; then
              echo "Refusing to publish an outdated main commit." >&2
              exit 1
            fi
          fi

          for tag in ${GHCR_TAGS} ${DOCKERHUB_TAGS}; do
            docker tag "${SOURCE_IMAGE}" "$tag"
            docker push "$tag"
          done

          ghcr_digest="$(docker buildx imagetools inspect "${IMAGE_GHCR}:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          dockerhub_digest="$(docker buildx imagetools inspect "${IMAGE_DOCKERHUB}:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$ghcr_digest"
          test -n "$dockerhub_digest"
          test "$ghcr_digest" = "$dockerhub_digest"
          {
            echo "ghcr_digest=${ghcr_digest}"
            echo "dockerhub_digest=${dockerhub_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        if: github.event_name == 'push'
        env:
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
        run: |
          cosign sign --yes "${IMAGE_GHCR}@${GHCR_DIGEST}"
          cosign sign --yes "${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}"

      - name: Attest GHCR image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_GHCR }}
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_DOCKERHUB }}
          subject-digest: ${{ steps.push.outputs.dockerhub_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record image digests
        if: github.event_name == 'push'
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          VERSION: ${{ steps.release.outputs.version }}
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "channel=${CHANNEL}"
            echo "version=${VERSION}"
            echo "ghcr=${IMAGE_GHCR}@${GHCR_DIGEST}"
            echo "dockerhub=${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}"
          } | tee image-digests.txt
          {
            echo "## Published image digests"
            echo
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- \`${IMAGE_GHCR}@${GHCR_DIGEST}\`"
            echo "- \`${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digests
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ github.sha }}
          path: image-digests.txt
          if-no-files-found: error

      - name: Create or update main failure issue
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_GATE_OUTCOME: ${{ steps.sonar-quality-gate.outcome }}
        run: |
          set -euo pipefail

          failed_step=''
          if [ "$SONAR_GATE_OUTCOME" = failure ]; then
            failed_step='SonarQube quality gate'
          else
            failed_step="$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == "publish") | .steps[] | select(.conclusion == "failure") | .name' \
              | head -n 1)"
          fi
          failed_step="${failed_step:-Unknown publish step}"
          failure_slug="$(tr '[:upper:]' '[:lower:]' <<<"$failed_step" | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')"

          report=.scannerwork/report-task.txt
          sonar_details=''
          if [ "$failed_step" = 'SonarQube quality gate' ]; then
            if python .github/scripts/sync-sonar-findings.py "$report" > sonar-sync.txt 2>&1; then
              {
                echo "## SonarQube findings"
                echo
                cat sonar-sync.txt
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sonar_details="$(cat <<EOF

          ### SonarQube finding sync

          \`$(tr '\n' ' ' < sonar-sync.txt)\`
          EOF
            )"
          fi

          cat > main-failure.md <<EOF
          Main publish pipeline failed.

          - Failure point: \`publish / ${failed_step}\`
          - Commit: ${GITHUB_SHA}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          ${sonar_details}
          EOF
          {
            echo "## Main publish failure"
            echo
            cat main-failure.md
          } >> "$GITHUB_STEP_SUMMARY"

          FAILURE_KEY="publish-${failure_slug}" \
          FAILURE_TITLE="[tech debt] Main publish failed: ${failed_step}" \
          LEGACY_TITLE='[tech debt] Main publish pipeline blocked' \
            bash .github/scripts/upsert-main-failure-issue.sh main-failure.md

  report-validation-failure:
    name: report validation failure
    needs: [quality, aislop, codeql, architecture]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        (
          needs.quality.result != 'success' ||
          needs.aislop.result != 'success' ||
          needs.codeql.result != 'success' ||
          needs.architecture.result != 'success'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Create or update main failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          AISLOP_RESULT: ${{ needs.aislop.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
        run: |
          set -euo pipefail

          failed_gates=()
          [ "$QUALITY_RESULT" = success ] || failed_gates+=(quality)
          [ "$AISLOP_RESULT" = success ] || failed_gates+=(aislop)
          [ "$CODEQL_RESULT" = success ] || failed_gates+=(codeql)
          [ "$ARCHITECTURE_RESULT" = success ] || failed_gates+=(architecture)
          failed_csv="$(IFS=,; echo "${failed_gates[*]}")"
          failure_slug="$(IFS=-; echo "${failed_gates[*]}")"

          cat > main-failure.md <<EOF
          Main validation failed before publishing.

          - Failure point: \`validation / ${failed_csv}\`
          - Commit: ${GITHUB_SHA}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Quality: ${QUALITY_RESULT}
          - Aislop: ${AISLOP_RESULT}
          - CodeQL: ${CODEQL_RESULT}
          - Architecture: ${ARCHITECTURE_RESULT}
          EOF

          FAILURE_KEY="validation-${failure_slug}" \
          FAILURE_TITLE="[tech debt] Main validation failed: ${failed_csv}" \
            bash .github/scripts/upsert-main-failure-issue.sh main-failure.md
