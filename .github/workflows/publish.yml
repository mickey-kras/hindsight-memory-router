name: publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  container:
    name: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
      issues: write
    env:
      IMAGE_GHCR: ghcr.io/${{ github.repository }}
      IMAGE_DOCKERHUB: docker.io/mickeykrasilnikov/hindsight-memory-router
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Connect to the tailnet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          targets: infosphere.bullhead-kitefin.ts.net
          use-cache: 'true'

      - name: Set up Python
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Generate coverage for SonarQube
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -m pip install 'pip==26.1.2'
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'
          coverage run -m pytest
          coverage xml

      - name: SonarQube analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 6
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        with:
          pollingTimeoutSec: 270
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ env.SOURCE_IMAGE }}

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ github.event_name == 'pull_request' && 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' || 'CRITICAL,HIGH' }}
          ignore-unfixed: ${{ github.event_name != 'pull_request' }}
          exit-code: 0
          limit-severities-for-sarif: true
          version: v0.71.2

      - name: Verify Trivy SARIF
        run: test -s trivy-results.sarif

      - name: Upload Trivy SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy PR gate
        if: github.event_name == 'pull_request'
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: >-
          trivy image
          --exit-code 1
          --exit-on-eol 1
          --severity MEDIUM,HIGH,CRITICAL
          --ignore-unfixed
          "${SOURCE_IMAGE}"

      - name: Trivy critical gate
        if: github.event_name != 'pull_request'
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: >-
          trivy image
          --exit-code 1
          --exit-on-eol 1
          --severity HIGH,CRITICAL
          --ignore-unfixed
          "${SOURCE_IMAGE}"

      - name: Select publish tags
        if: github.event_name == 'push'
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/heads/main)
              channel=main
              version=latest
              ghcr_tags="${IMAGE_GHCR}:latest ${IMAGE_GHCR}:${GITHUB_SHA}"
              dockerhub_tags="${IMAGE_DOCKERHUB}:latest ${IMAGE_DOCKERHUB}:${GITHUB_SHA}"
              ;;
            refs/tags/v*)
              version="${GITHUB_REF_NAME}"
              if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
                echo "Invalid release tag: ${version}" >&2
                exit 1
              fi
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "Tag ${version} is not reachable from main." >&2
                exit 1
              fi
              if ! gh api --paginate \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?branch=main&event=push&status=success&per_page=100" \
                --jq '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA) | .id' \
                | grep -q .; then
                echo "Commit ${GITHUB_SHA} has no successful main publish run." >&2
                exit 1
              fi
              channel=stable-tag
              ghcr_tags="${IMAGE_GHCR}:${version} ${IMAGE_GHCR}:${GITHUB_SHA}"
              dockerhub_tags="${IMAGE_DOCKERHUB}:${version} ${IMAGE_DOCKERHUB}:${GITHUB_SHA}"
              ;;
            *)
              echo "Unsupported publishing ref: ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac

          {
            echo "channel=${channel}"
            echo "version=${version}"
            echo "ghcr_tags=${ghcr_tags}"
            echo "dockerhub_tags=${dockerhub_tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the scanned image
        if: github.event_name == 'push'
        id: push
        env:
          GHCR_TAGS: ${{ steps.release.outputs.ghcr_tags }}
          DOCKERHUB_TAGS: ${{ steps.release.outputs.dockerhub_tags }}
        run: |
          set -euo pipefail

          for tag in ${GHCR_TAGS} ${DOCKERHUB_TAGS}; do
            docker tag "${SOURCE_IMAGE}" "$tag"
            docker push "$tag"
          done

          ghcr_digest="$(docker buildx imagetools inspect "${IMAGE_GHCR}:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          dockerhub_digest="$(docker buildx imagetools inspect "${IMAGE_DOCKERHUB}:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$ghcr_digest"
          test -n "$dockerhub_digest"
          test "$ghcr_digest" = "$dockerhub_digest"
          {
            echo "ghcr_digest=${ghcr_digest}"
            echo "dockerhub_digest=${dockerhub_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        if: github.event_name == 'push'
        env:
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
        run: |
          cosign sign --yes "${IMAGE_GHCR}@${GHCR_DIGEST}"
          cosign sign --yes "${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}"

      - name: Attest GHCR image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_GHCR }}
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_DOCKERHUB }}
          subject-digest: ${{ steps.push.outputs.dockerhub_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record image digests
        if: github.event_name == 'push'
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          VERSION: ${{ steps.release.outputs.version }}
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "channel=${CHANNEL}"
            echo "version=${VERSION}"
            echo "ghcr=${IMAGE_GHCR}@${GHCR_DIGEST}"
            echo "dockerhub=${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}"
          } | tee image-digests.txt
          {
            echo "## Published image digests"
            echo
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- \`${IMAGE_GHCR}@${GHCR_DIGEST}\`"
            echo "- \`${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digests
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ github.sha }}
          path: image-digests.txt
          if-no-files-found: error

      - name: Create or update main failure issue
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='[tech debt] Main publish pipeline blocked'
          body=$(cat <<EOF
          Main publish pipeline failed.

          - Commit: ${GITHUB_SHA}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          number="$(gh issue list --state open --search 'in:title "Main publish pipeline blocked"' --json number,title --jq '.[] | select(.title == "[tech debt] Main publish pipeline blocked") | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body" --add-assignee "$GITHUB_REPOSITORY_OWNER"
          else
            gh issue create --title "$title" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
