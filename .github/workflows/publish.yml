name: publish

on:
  pull_request:
  push:
    branches:
      - main
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  container:
    name: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_GHCR: ghcr.io/${{ github.repository }}
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE_GHCR }}:${{ github.sha }}

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_GHCR }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          version: v0.71.2

      - name: Verify Trivy SARIF
        run: test -s trivy-results.sarif

      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: success() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy critical gate (high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_GHCR }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.71.2

  publish:
    name: publish
    needs: container
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/release/v') ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_GHCR: ghcr.io/${{ github.repository }}
      IMAGE_DOCKERHUB: docker.io/mickeykrasilnikov/hindsight-memory-router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - name: Validate publishing source and select tags
        id: release
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/heads/main)
              {
                echo "channel=main"
                echo "version=latest"
                echo "ghcr_tags<<EOF"
                echo "${IMAGE_GHCR}:latest"
                echo "${IMAGE_GHCR}:${GITHUB_SHA}"
                echo "EOF"
                echo "dockerhub_tags<<EOF"
                echo "${IMAGE_DOCKERHUB}:latest"
                echo "${IMAGE_DOCKERHUB}:${GITHUB_SHA}"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;

            refs/heads/release/v*)
              version="${GITHUB_REF_NAME#release/}"
              if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
                echo "Invalid release branch name: ${GITHUB_REF_NAME}" >&2
                exit 1
              fi
              {
                echo "channel=release-candidate"
                echo "version=${version}-rc"
                echo "ghcr_tags<<EOF"
                echo "${IMAGE_GHCR}:${version}-rc"
                echo "${IMAGE_GHCR}:${GITHUB_SHA}"
                echo "EOF"
                echo "dockerhub_tags<<EOF"
                echo "${IMAGE_DOCKERHUB}:${version}-rc"
                echo "${IMAGE_DOCKERHUB}:${GITHUB_SHA}"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;

            refs/tags/v*)
              version="${GITHUB_REF_NAME}"
              if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
                echo "Invalid release tag: ${version}" >&2
                exit 1
              fi

              git fetch --no-tags origin main
              allowed=false
              if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                allowed=true
              fi

              release_branch="release/${version}"
              if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
                git fetch --no-tags origin \
                  "refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
                if git merge-base --is-ancestor \
                  "$GITHUB_SHA" "refs/remotes/origin/${release_branch}"; then
                  allowed=true
                fi
              fi

              if [[ "$allowed" != true ]]; then
                echo "Tag ${version} is not reachable from main or ${release_branch}." >&2
                exit 1
              fi

              {
                echo "channel=stable-tag"
                echo "version=${version}"
                echo "ghcr_tags<<EOF"
                echo "${IMAGE_GHCR}:${version}"
                echo "${IMAGE_GHCR}:${GITHUB_SHA}"
                echo "EOF"
                echo "dockerhub_tags<<EOF"
                echo "${IMAGE_DOCKERHUB}:${version}"
                echo "${IMAGE_DOCKERHUB}:${GITHUB_SHA}"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Unsupported publishing ref: ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push GHCR
        id: build-ghcr
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.ghcr_tags }}

      - name: Build and push Docker Hub
        id: build-dockerhub
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.dockerhub_tags }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        run: |
          cosign sign --yes ${{ env.IMAGE_GHCR }}@${{ steps.build-ghcr.outputs.digest }}
          cosign sign --yes ${{ env.IMAGE_DOCKERHUB }}@${{ steps.build-dockerhub.outputs.digest }}

      - name: Attest GHCR image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_GHCR }}
          subject-digest: ${{ steps.build-ghcr.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_DOCKERHUB }}
          subject-digest: ${{ steps.build-dockerhub.outputs.digest }}
          push-to-registry: true

      - name: Record image digests
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "channel=${{ steps.release.outputs.channel }}"
            echo "version=${{ steps.release.outputs.version }}"
            echo "ghcr=${IMAGE_GHCR}@${{ steps.build-ghcr.outputs.digest }}"
            echo "dockerhub=${IMAGE_DOCKERHUB}@${{ steps.build-dockerhub.outputs.digest }}"
          } | tee image-digests.txt
          {
            echo "## Published image digests"
            echo
            echo "- Channel: \`${{ steps.release.outputs.channel }}\`"
            echo "- Version: \`${{ steps.release.outputs.version }}\`"
            echo "- \`${IMAGE_GHCR}@${{ steps.build-ghcr.outputs.digest }}\`"
            echo "- \`${IMAGE_DOCKERHUB}@${{ steps.build-dockerhub.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ github.sha }}
          path: image-digests.txt
          if-no-files-found: error
