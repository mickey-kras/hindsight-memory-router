name: main

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      validation_only:
        description: Skip PR branch updates and Pages publication; retain all source validation.
        type: boolean
        default: false
      candidate_sha:
        type: string
        default: ''
      candidate_ref:
        type: string
        default: ''
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID:
        required: false
      TAILSCALE_AUDIENCE:
        required: false
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  push:
    branches:
      - main

concurrency:
  group: main-validation-${{ inputs.candidate_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: quality
    if: github.ref == 'refs/heads/main' || inputs.candidate_sha != ''
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      candidate_ref: ${{ inputs.candidate_ref }}

  update-pr-branches:
    name: update PR branches
    if: inputs.candidate_sha == '' && github.ref == 'refs/heads/main' && !inputs.validation_only
    permissions:
      contents: read
    uses: ./.github/workflows/pr-branch-updater.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  aislop:
    name: aislop
    if: github.ref == 'refs/heads/main' || inputs.candidate_sha != ''
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/aislop.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      candidate_ref: ${{ inputs.candidate_ref }}

  codeql:
    name: codeql
    if: github.ref == 'refs/heads/main' || inputs.candidate_sha != ''
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      candidate_ref: ${{ inputs.candidate_ref }}

  architecture:
    name: architecture
    if: github.ref == 'refs/heads/main' || inputs.candidate_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/architecture.yml
    with:
      validation_only: ${{ inputs.validation_only == true }}
      candidate_sha: ${{ inputs.candidate_sha }}
      candidate_ref: ${{ inputs.candidate_ref }}

  pages:
    name: pages
    needs: architecture
    if: inputs.candidate_sha == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !inputs.validation_only
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy architecture Pages site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.architecture.outputs.pages_artifact_name }}

  sonar:
    name: sonar
    needs: [quality, aislop, codeql, architecture]
    if: inputs.candidate_sha == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      COVERAGE_ARTIFACT_ID: ${{ needs.quality.outputs.coverage_artifact_id }}
      PRODUCER_RUN_ATTEMPT: ${{ needs.quality.outputs.coverage_run_attempt }}
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Require authoritative coverage producer
        run: |
          if [[ ! "$COVERAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || [[ ! "$PRODUCER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo 'CoverageEvidenceError: missing authoritative coverage producer output; rerun authoritative main CI.' >&2
            exit 1
          fi

      - name: Download authoritative coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.quality.outputs.coverage_artifact_id }}
          path: ${{ runner.temp }}/coverage-evidence
          digest-mismatch: error

      - name: Verify authoritative coverage
        run: python .github/scripts/coverage-artifact.py restore "$RUNNER_TEMP/coverage-evidence"

      - name: Mask configured SonarQube endpoint
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/mask-sonar-context.py configured
      - name: Connect to the tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:github-sonar
          use-cache: 'true'

      - name: Mask advertised SonarQube endpoint
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/mask-sonar-context.py advertised
      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        id: sonar-quality-gate
        timeout-minutes: 6
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        with:
          pollingTimeoutSec: 270
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Synchronize SonarQube findings
        if: ${{ !cancelled() && failure() && steps.sonar-quality-gate.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python .github/scripts/sync-sonar-findings.py .scannerwork/report-task.txt

  publish:
    name: validate image and release
    needs: [quality, aislop, codeql, architecture]
    if: >-
      (github.ref == 'refs/heads/main' || inputs.candidate_sha != '') &&
      needs.quality.result == 'success' && needs.aislop.result == 'success' &&
      needs.codeql.result == 'success' && needs.architecture.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.finalized.outputs.latest }}
      ghcr_digest: ${{ steps.push.outputs.ghcr_digest }}
    environment: release-automation
    concurrency:
      group: image-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
      issues: write
    env:
      RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
      RELEASE_SETTINGS_REVIEW: ${{ vars.RELEASE_SETTINGS_REVIEW }}
      HINDSIGHT_TEST_IMAGE: ${{ needs.quality.outputs.hindsight_image }}
      IMAGE_GHCR: ghcr.io/${{ github.repository }}
      IMAGE_DOCKERHUB: docker.io/mickeykrasilnikov/hindsight-memory-router
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.candidate_sha || github.sha }}
      SOURCE_SHA: ${{ inputs.candidate_sha || github.sha }}
      RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RELEASE_CANDIDATE_REF: ${{ inputs.candidate_ref }}
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Release preflight
        if: inputs.candidate_sha != ''
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./.github/scripts/release.cjs').validate({ github, context, core, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } });

      - name: Find previously tested image
        if: inputs.candidate_sha != ''
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./.github/scripts/release.cjs').retryArtifacts({ github, context, core, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } });

      - name: Restore previously tested image
        if: steps.candidate.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true

      - name: Load previously tested image
        if: steps.candidate.outputs.artifact != ''
        run: |
          docker load --input "$RUNNER_TEMP/candidate/router-image.tar"
          docker tag "$SOURCE_IMAGE" hindsight-memory-router:ci

      - name: Build image once
        if: steps.candidate.outputs.artifact == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          provenance: false
          labels: org.opencontainers.image.revision=${{ inputs.candidate_sha || github.sha }}
          tags: |
            ${{ env.SOURCE_IMAGE }}
            hindsight-memory-router:ci

      - name: Default Compose smoke
        run: bash tests/integration/default-compose-smoke.sh

      - name: Fake Hindsight router-storage parity
        id: fake-smoke
        run: |
          set -uo pipefail
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake sqlite > >(tee fake-sqlite-smoke.log) 2>&1 &
          sqlite_pid=$!
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh fake postgres > >(tee fake-postgres-smoke.log) 2>&1 &
          postgres_pid=$!
          status=0
          wait "$sqlite_pid" || status=1
          wait "$postgres_pid" || status=1
          exit "$status"

      - name: Upload fake smoke diagnostics
        if: failure() && steps.fake-smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fake-smoke-diagnostics-${{ inputs.candidate_sha || github.sha }}-${{ github.run_attempt }}
          path: |
            fake-sqlite-smoke.log
            fake-postgres-smoke.log
          if-no-files-found: error

      - name: Real Hindsight router-storage parity
        id: real-smoke
        run: |
          set -uo pipefail
          status=0
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real sqlite > >(tee real-sqlite-smoke.log) 2>&1 || status=1
          HMR_SKIP_BUILD=true bash tests/integration/smoke.sh real postgres > >(tee real-postgres-smoke.log) 2>&1 || status=1
          exit "$status"

      - name: Upload real smoke diagnostics
        if: failure() && steps.real-smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-smoke-diagnostics-${{ inputs.candidate_sha || github.sha }}-${{ github.run_attempt }}
          path: |
            real-sqlite-smoke.log
            real-postgres-smoke.log
          if-no-files-found: error

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          limit-severities-for-sarif: true
          version: v0.71.2

      - name: Verify Trivy SARIF
        run: test -s trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/publish.yml:container
          ref: ${{ inputs.candidate_ref || github.ref }}
          sha: ${{ inputs.candidate_sha || github.sha }}

      - name: Trivy critical gate
        # Policy contract equivalent: ignore-unfixed: true.
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          command -v trivy >/dev/null
          trivy image \
            --exit-code 1 \
            --exit-on-eol 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${SOURCE_IMAGE}"

      - name: Save tested image
        if: inputs.candidate_sha != '' && steps.candidate.outputs.artifact == ''
        run: docker save --output "$RUNNER_TEMP/router-image.tar" "$SOURCE_IMAGE"

      - name: Retain tested image for retries
        if: inputs.candidate_sha != '' && steps.candidate.outputs.artifact == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/router-image.tar
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Log in to GHCR
        if: inputs.candidate_sha != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: inputs.candidate_sha != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Recheck release head before publication
        if: inputs.candidate_sha != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./.github/scripts/release.cjs').validate({ github, context, core, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } });

      - name: Push the scanned image
        if: inputs.candidate_sha != ''
        id: push
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/scripts/publish-image.sh

      - name: Restore prepared release assets
        if: steps.push.outputs.published == 'true' && steps.candidate.outputs.release_assets != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.candidate.outputs.release_assets }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify and restore release bytes
        if: steps.push.outputs.published == 'true' && steps.candidate.outputs.release_assets != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            require('./.github/scripts/release.cjs').restoreReleaseAssets({
              context, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF }, directory: `${process.env.RUNNER_TEMP}/release-assets`,
            });

      - name: Generate CycloneDX SBOM
        if: steps.push.outputs.published == 'true' && steps.candidate.outputs.release_assets == ''
        env:
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
        run: |
          trivy image --format cyclonedx --output sbom.raw.json "${IMAGE_GHCR}@${GHCR_DIGEST}"
          SBOM_SUBJECT="${IMAGE_GHCR}@${GHCR_DIGEST}" \
          SBOM_TIMESTAMP="$(git show -s --format=%cI "${SOURCE_SHA}")" \
            python3 .github/scripts/normalize-sbom.py sbom.raw.json sbom.cdx.json

      - name: Install Cosign
        if: steps.push.outputs.published == 'true'
        uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
        with:
          cosign-release: v3.1.3

      - name: Sign published images
        if: steps.push.outputs.published == 'true'
        env:
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
        run: |
          cosign sign --yes "${IMAGE_GHCR}@${GHCR_DIGEST}"
          cosign sign --yes "${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}"

      - name: Bind provenance to the workflow and release candidate
        if: steps.push.outputs.published == 'true'
        id: provenance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./.github/scripts/release.cjs').candidateProvenance({ github, context, core, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } });

      - name: Attest GHCR image
        if: steps.push.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_IMAGE: ${{ env.IMAGE_GHCR }}
          ATTEST_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          ATTEST_PREDICATE: ${{ steps.provenance.outputs.path }}
          ATTEST_TYPE: ${{ steps.provenance.outputs.type }}
        with:
          script: |
            await require('./.github/scripts/attest-image.cjs').attestImage({
              github, context, image: process.env.ATTEST_IMAGE, digest: process.env.ATTEST_DIGEST,
              predicatePath: process.env.ATTEST_PREDICATE, predicateType: process.env.ATTEST_TYPE,
              label: 'ghcr-provenance',
            });

      - name: Attest Docker Hub image
        if: steps.push.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_IMAGE: ${{ env.IMAGE_DOCKERHUB }}
          ATTEST_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
          ATTEST_PREDICATE: ${{ steps.provenance.outputs.path }}
          ATTEST_TYPE: ${{ steps.provenance.outputs.type }}
        with:
          script: |
            await require('./.github/scripts/attest-image.cjs').attestImage({
              github, context, image: process.env.ATTEST_IMAGE, digest: process.env.ATTEST_DIGEST,
              predicatePath: process.env.ATTEST_PREDICATE, predicateType: process.env.ATTEST_TYPE,
              label: 'dockerhub-provenance',
            });

      - name: Attest GHCR SBOM
        if: steps.push.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_IMAGE: ${{ env.IMAGE_GHCR }}
          ATTEST_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          ATTEST_PREDICATE: sbom.cdx.json
          ATTEST_TYPE: https://cyclonedx.org/bom
        with:
          script: |
            await require('./.github/scripts/attest-image.cjs').attestImage({
              github, context, image: process.env.ATTEST_IMAGE, digest: process.env.ATTEST_DIGEST,
              predicatePath: process.env.ATTEST_PREDICATE, predicateType: process.env.ATTEST_TYPE,
              label: 'ghcr-sbom',
            });

      - name: Attest Docker Hub SBOM
        if: steps.push.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_IMAGE: ${{ env.IMAGE_DOCKERHUB }}
          ATTEST_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
          ATTEST_PREDICATE: sbom.cdx.json
          ATTEST_TYPE: https://cyclonedx.org/bom
        with:
          script: |
            await require('./.github/scripts/attest-image.cjs').attestImage({
              github, context, image: process.env.ATTEST_IMAGE, digest: process.env.ATTEST_DIGEST,
              predicatePath: process.env.ATTEST_PREDICATE, predicateType: process.env.ATTEST_TYPE,
              label: 'dockerhub-sbom',
            });

      - name: Retain verified attestation bundles
        if: steps.push.outputs.published == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestations-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestations/*.sigstore.json
          if-no-files-found: error

      - name: Set up Node for the UI package
        if: steps.push.outputs.published == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Build and pack the UI package
        if: steps.push.outputs.published == 'true'
        id: ui-package
        env:
          RELEASE_ASSETS: ${{ steps.candidate.outputs.release_assets }}
        run: |
          if [ -z "$RELEASE_ASSETS" ]; then
            npm ci --prefix ui
            npm pack ./ui --pack-destination .
          fi
          tarball="$(node -p "const p = require('./ui/package.json'); p.name.replace(/^@/, '').replace('/', '-') + '-' + p.version + '.tgz'")"
          test -s "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Sign the UI package
        if: steps.push.outputs.published == 'true' && steps.candidate.outputs.release_assets == ''
        env:
          UI_TARBALL: ${{ steps.ui-package.outputs.tarball }}
        run: cosign sign-blob --yes --bundle "${UI_TARBALL}.sigstore.json" "${UI_TARBALL}"

      - name: Record image digests
        if: steps.push.outputs.published == 'true' && steps.candidate.outputs.release_assets == ''
        env:
          CHANNEL: release
          VERSION: ${{ steps.release.outputs.version }}
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
          UI_TARBALL: ${{ steps.ui-package.outputs.tarball }}
        run: |
          {
            echo "commit=${SOURCE_SHA}"
            echo "channel=${CHANNEL}"
            echo "version=${VERSION}"
            echo "ghcr=${IMAGE_GHCR}@${GHCR_DIGEST}"
            echo "dockerhub=${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}"
            echo "sbom=sha256:$(sha256sum sbom.cdx.json | cut -d' ' -f1)"
            echo "ui-package=sha256:$(sha256sum "${UI_TARBALL}" | cut -d' ' -f1)"
          } | tee image-digests.txt
          {
            echo "## Published image digests"
            echo
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- \`${IMAGE_GHCR}@${GHCR_DIGEST}\`"
            echo "- \`${IMAGE_DOCKERHUB}@${DOCKERHUB_DIGEST}\`"
            echo "- CycloneDX SBOM: \`sbom.cdx.json\`, attested to both registries"
            echo "- UI package: \`${UI_TARBALL}\` (cosign bundle \`${UI_TARBALL}.sigstore.json\`), attached to the release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digests
        if: steps.push.outputs.published == 'true' && steps.candidate.outputs.release_assets == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: |
            image-digests.txt
            sbom.cdx.json
            ${{ steps.ui-package.outputs.tarball }}
            ${{ steps.ui-package.outputs.tarball }}.sigstore.json
          if-no-files-found: error

      - name: Check npm package availability
        if: steps.push.outputs.published == 'true'
        run: node .github/scripts/publish-npm.cjs --check

      - name: Release App token
        if: inputs.candidate_sha != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish immutable release
        if: steps.push.outputs.published == 'true'
        id: finalized
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release.cjs').finalize({ github, context, core, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } });

      - name: Verify signed UI package
        if: steps.push.outputs.published == 'true'
        env:
          UI_TARBALL: ${{ steps.ui-package.outputs.tarball }}
        run: |
          cosign verify-blob --bundle "${UI_TARBALL}.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$UI_TARBALL"

      - name: Publish verified UI tarball to public npm
        if: steps.push.outputs.published == 'true'
        run: |
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = 11.19.1
          node .github/scripts/publish-npm.cjs

      - name: Promote latest released image
        if: steps.finalized.outputs.latest == 'true'
        env:
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ steps.push.outputs.dockerhub_digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_GHCR:latest" "$IMAGE_GHCR@$GHCR_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_DOCKERHUB:latest" "$IMAGE_DOCKERHUB@$DOCKERHUB_DIGEST"

  release-followup:
    name: release follow-up
    needs: [publish]
    if: >-
      inputs.candidate_sha != '' &&
      needs.publish.result == 'success' &&
      needs.publish.outputs.released != ''
    runs-on: ubuntu-latest
    environment: release-automation
    concurrency:
      group: image-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RELEASE_CANDIDATE_REF: ${{ inputs.candidate_ref }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the next version bump pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release.cjs').bumpReleasedVersion({ github, context, core, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } });
      - name: Delete the published release branch
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release.cjs').deletePublishedBranch({ github, context, core, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } });

  cleanup:
    name: clean up failed release
    needs: [quality, aislop, codeql, architecture, publish]
    if: >-
      ${{ !cancelled() && inputs.candidate_sha != '' &&
        needs.publish.outputs.released == '' &&
        (needs.quality.result == 'failure' || needs.aislop.result == 'failure' ||
         needs.codeql.result == 'failure' || needs.architecture.result == 'failure' ||
         needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: release-automation
    concurrency:
      group: image-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RELEASE_CANDIDATE_REF: ${{ inputs.candidate_ref }}
      IMAGE_GHCR: ghcr.io/${{ github.repository }}
      IMAGE_DOCKERHUB: docker.io/mickeykrasilnikov/hindsight-memory-router
      CLEANUP_DIGEST: ${{ needs.publish.outputs.ghcr_digest }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - name: Remove orphaned registry tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          script: |
            await require('./.github/scripts/release-cleanup.cjs').registries({ github, context, core, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } });
      - name: Retain the failed release branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./.github/scripts/release-cleanup.cjs').branch({ github, context, core, target: { sha: process.env.RELEASE_CANDIDATE_SHA, ref: process.env.RELEASE_CANDIDATE_REF } });

  report-validation-failure:
    name: report validation failure
    needs: [quality, aislop, codeql, architecture, publish, sonar, pages, update-pr-branches]
    if: >-
      ${{
        !cancelled() &&
        (github.ref == 'refs/heads/main' || inputs.candidate_sha != '') &&
        (
          needs.quality.result == 'failure' ||
          needs.aislop.result == 'failure' ||
          needs.codeql.result == 'failure' ||
          needs.architecture.result == 'failure' ||
          needs.publish.result == 'failure' ||
          (github.ref == 'refs/heads/main' && needs.sonar.result == 'failure') ||
          (github.ref == 'refs/heads/main' && needs.pages.result == 'failure') ||
          needs.update-pr-branches.result == 'failure'
        )
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: main-failure-issues-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report each distinct failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REPORT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: bash .github/scripts/upsert-main-failure-issue.sh
