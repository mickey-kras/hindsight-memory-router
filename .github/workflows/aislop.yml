name: aislop

on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        default: ''
      candidate_ref:
        type: string
        default: ''

concurrency:
  group: aislop-${{ github.event_name }}-${{ inputs.candidate_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  status:
    name: aislop status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aislop quality gate
        run: npm run --silent aislop:ci -- --sarif > aislop.sarif

      - name: Aislop findings gate
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const sarif = JSON.parse(readFileSync('aislop.sarif', 'utf8'));
          if (sarif?.version !== '2.1.0' || !Array.isArray(sarif.runs) || sarif.runs.length === 0 ||
              sarif.runs.some((run) => run?.tool?.driver?.name !== 'aislop' || !Array.isArray(run.results))) {
            throw new Error('Aislop produced an invalid SARIF report.');
          }
          const allFindings = sarif.runs.flatMap((run) => run.results);
          if (allFindings.some((finding) => !finding || typeof finding.ruleId !== 'string' ||
              finding.ruleId.length === 0 || typeof finding.message?.text !== 'string' ||
              !['error', 'warning', 'note'].includes(finding.level))) {
            throw new Error('Aislop produced an invalid SARIF finding.');
          }
          console.log(`Aislop SARIF: ${allFindings.length} finding(s).`);
          for (const finding of allFindings) {
            const location = finding.locations?.[0]?.physicalLocation;
            const file = JSON.stringify(location?.artifactLocation?.uri ?? 'unknown');
            const line = Number.isInteger(location?.region?.startLine) ? location.region.startLine : '?';
            console.log(`${finding.level} ${JSON.stringify(finding.ruleId)} at ${file}:${line}: ${JSON.stringify(finding.message.text)}`);
          }
          const ignored = allFindings.filter(
            (finding) => finding.ruleId === 'security/dependency-audit-skipped',
          );
          if (ignored.length > 0) {
            console.warn('Aislop dependency audit timed out; required CI audit remains authoritative.');
          }
          const findings = allFindings
            // Dependency audit is enforced by the required CI checks job.
            .filter((finding) => finding.ruleId !== 'security/dependency-audit-skipped');
          if (findings.length > 0) {
            const rules = [...new Set(findings.map((finding) => finding.ruleId ?? 'unknown'))];
            console.error(`Aislop reported ${findings.length} finding(s): ${rules.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Upload Aislop SARIF
        if: >-
          ${{
            always() &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: aislop.sarif
          category: .github/workflows/publish.yml:status
          ref: ${{ inputs.candidate_ref }}
          sha: ${{ inputs.candidate_sha }}
