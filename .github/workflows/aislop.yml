name: aislop

# Base policy migration marker; remove after this PR.
# npm run --silent aislop:ci -- --sarif

on:
  pull_request:
  workflow_call:

concurrency:
  group: aislop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  status:
    name: aislop status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aislop quality gate
        run: npm run aislop:ci:human

      - name: Aislop SARIF
        if: always()
        run: npm run --silent aislop:ci:sarif > aislop.sarif

      - name: Aislop findings gate
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const sarif = JSON.parse(readFileSync('aislop.sarif', 'utf8'));
          const findings = sarif.runs.flatMap((run) => run.results ?? []);
          if (findings.length > 0) {
            const rules = [...new Set(findings.map((finding) => finding.ruleId ?? 'unknown'))];
            console.error(`Aislop reported ${findings.length} finding(s): ${rules.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Upload Aislop SARIF
        if: >-
          ${{
            always() &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: aislop.sarif
