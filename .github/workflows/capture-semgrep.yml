name: capture-semgrep

on:
  pull_request:

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Vendor resolved Semgrep rules
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b"
          curl --location --fail --silent --show-error https://semgrep.dev/c/auto -o semgrep-auto.yml
          docker pull "$SEMGREP_IMAGE"
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            sh -lc 'python - <<"PY"
          import pathlib
          import re

          source = pathlib.Path("semgrep-auto.yml").read_text()
          relevant = {"typescript", "ts", "javascript", "yaml", "json", "dockerfile", "generic"}
          blocks = source.removeprefix("rules:\n").split("\n- id: ")
          selected = []

          for index, raw in enumerate(blocks):
              block = raw if index == 0 else "- id: " + raw
              if not block.startswith("- id: "):
                  continue
              lines = block.splitlines()
              languages = set()
              for line_index, line in enumerate(lines):
                  if line == "  languages:":
                      cursor = line_index + 1
                      while cursor < len(lines) and lines[cursor].startswith("  - "):
                          languages.add(lines[cursor][4:])
                          cursor += 1
                      break
              if not languages & relevant:
                  continue

              compact = []
              skipping_metadata = False
              for line in lines:
                  if line == "  metadata:":
                      skipping_metadata = True
                      continue
                  if skipping_metadata and re.match(r"^  [A-Za-z0-9_-]+:", line):
                      skipping_metadata = False
                  if not skipping_metadata:
                      compact.append(line)
              selected.append("\n".join(compact))

          header = (
              "# Vendored from the Semgrep auto config resolved with Semgrep 1.172.0.\n"
              "# Scope: rules applicable to this repository (TypeScript/JavaScript/YAML/JSON/Dockerfile/generic).\n"
              "# Update intentionally: resolve the new auto config with the pinned Semgrep image, filter to these languages, review the diff, then commit it.\n"
          )
          pathlib.Path(".semgrep.generated.yml").write_text(
              header + "rules:\n" + "\n".join(selected) + "\n"
          )
          print(f"vendored {len(selected)} rules")
          PY'
          rm semgrep-auto.yml

          git pull --ff-only origin "${{ github.event.pull_request.head.ref }}"
          mv .semgrep.generated.yml .semgrep.yml
          git rm .github/workflows/capture-semgrep.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .semgrep.yml
          git commit -m "Vendor resolved Semgrep rules"
          git push
