name: refresh openapi contract

on:
  push:
    branches: [docs/openapi-swagger-ui]
    paths: [.github/workflows/refresh-openapi-contract.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/openapi-swagger-ui

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Tighten request schemas
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'openapi/openapi.json';
          const document = JSON.parse(readFileSync(path, 'utf8'));
          document.components.schemas.MemoryItem.properties.content.minLength = 1;
          document.components.schemas.RecallRequest.properties.query.minLength = 1;
          writeFileSync(path, `${JSON.stringify(document, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-openapi-contract.yml
          git add openapi/openapi.json package-lock.json
          git commit -m "Tighten documented request schemas"
          git push
