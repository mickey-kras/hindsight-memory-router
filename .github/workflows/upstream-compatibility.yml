name: Upstream compatibility

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compatibility
  cancel-in-progress: false

jobs:
  compatibility:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Resolve latest stable Hindsight
        id: upstream
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./.github/scripts/release.cjs').resolve({ github, context, core });
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r dev-requirements.txt
      - name: Checkout resolved upstream sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vectorize-io/hindsight
          ref: ${{ steps.upstream.outputs.sha }}
          path: .upstream/hindsight
          persist-credentials: false
      - name: Verify reviewed compatibility inventory
        run: python scripts/check_openclaw_compat.py .upstream/hindsight
