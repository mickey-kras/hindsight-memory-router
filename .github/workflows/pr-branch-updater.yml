name: pr branch updater

on:
  workflow_call:
    inputs:
      refresh_mode:
        type: string
        default: automatic
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      pull_number:
        description: PR number to refresh against the selected base branch
        type: string
        required: true

permissions:
  contents: read

jobs:
  update:
    name: update
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    environment: release-automation
    env:
      PR_REFRESH_MODE: ${{ inputs.refresh_mode || 'manual' }}
      PR_REFRESH_NUMBER: ${{ inputs.pull_number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate updater context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            require('./.github/scripts/pr-branch-updater.cjs').validateContext(context, {
              mode: process.env.PR_REFRESH_MODE, pullNumber: process.env.PR_REFRESH_NUMBER,
            });
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update open PR branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { run } = require('./.github/scripts/pr-branch-updater.cjs');
            await run({ github, context, core,
              mode: process.env.PR_REFRESH_MODE, pullNumber: process.env.PR_REFRESH_NUMBER,
            });
