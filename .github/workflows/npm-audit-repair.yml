name: npm audit repair

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: npm-audit-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - name: Repair fixable npm advisories
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          for directory in . ui .github/scripts; do
            if ! npm audit --prefix "$directory" --audit-level=moderate; then
              npm audit fix --prefix "$directory" --package-lock-only --ignore-scripts --no-fund
              npm audit --prefix "$directory" --audit-level=moderate
            fi
          done
          while IFS= read -r path; do
            case "$path" in
              package-lock.json|ui/package-lock.json|.github/scripts/package-lock.json) ;;
              *) echo "Unexpected audit change: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git diff --check
          if ! git diff --quiet; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Create repository App token
        if: steps.changes.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open gated security PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=security/npm-audit
          if [[ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" != 0 ]]; then
            echo "An npm audit repair PR is already open."
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json ui/package-lock.json .github/scripts/package-lock.json
          git commit -m 'fix: repair audited npm dependencies'
          gh auth setup-git
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'fix: repair audited npm dependencies' \
            --body 'Updates fixable npm lockfile advisories. Normal PR quality, security, and branch gates must pass before merging.'
