# Dependency review policy for pull requests (actions/dependency-review-action).
# Only dependencies a pull request adds or updates are reviewed, so existing
# dependencies are grandfathered. A reviewed exception for one of them belongs
# in allow-dependencies-licenses below as an exact package URL (purl).
fail-on-severity: high
deny-licenses:
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - GPL-1.0-only
  - GPL-1.0-or-later
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - SSPL-1.0
  - LicenseRef-clearlydefined-OTHER
# Grandfathered license exceptions as exact purls (e.g. pkg:npm/example@1.2.3).
allow-dependencies-licenses: []
