services:
  quarantine-key-init:
    build: .
    image: memory-router:local
    restart: "no"
    command:
      - node
      - dist/src/cli/bootstrapQuarantineKeys.js
      - --public-key
      - /app/bootstrap/public/quarantine-public.pem
      - --private-key
      - /app/bootstrap/private/quarantine-private.pem
    volumes:
      - memory-router-public-key:/app/bootstrap/public
      - memory-router-private-key:/app/bootstrap/private

  memory-router:
    build: .
    image: memory-router:local
    restart: unless-stopped
    depends_on:
      quarantine-key-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    command:
      - /bin/sh
      - -c
      - |
        export QUARANTINE_PUBLIC_KEY="$$(cat /app/bootstrap/public/quarantine-public.pem)"
        exec node dist/src/server.js
    ports:
      - "8890:8890"
    volumes:
      - memory-router-data:/app/data
      - memory-router-public-key:/app/bootstrap/public:ro

volumes:
  memory-router-data:
    name: memory-router-data
  memory-router-public-key:
    name: memory-router-quarantine-public-key
  memory-router-private-key:
    name: memory-router-quarantine-private-key
