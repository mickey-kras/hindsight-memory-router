services:
  memory-router:
    build: .
    image: memory-router:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MEMORY_ROUTER_HOST: "0.0.0.0"
      MEMORY_ROUTER_PORT: "${MEMORY_ROUTER_PORT:-8890}"
      QUARANTINE_PUBLIC_KEY: "${QUARANTINE_PUBLIC_KEY:?missing QUARANTINE_PUBLIC_KEY}"
    ports:
      - "127.0.0.1:${MEMORY_ROUTER_PORT:-8890}:${MEMORY_ROUTER_PORT:-8890}"
    volumes:
      - memory-router-data:/app/data

volumes:
  memory-router-data:
