[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-memory-router"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "agent-memory-guard==0.3.0",
  "aiosqlite==0.21.0",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "msgpack==1.2.1",
  "psycopg[binary]==3.2.9",
  "psycopg-pool==3.2.6",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "rfc8785==0.1.4",
  "setuptools==83.0.0",
  "starlette==1.3.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.6",
  "coverage==7.9.2",
  "mypy==1.17.0",
  "pip-audit==2.9.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.4",
]

[project.scripts]
memory-router = "memory_router.__main__:main"
memory-router-bootstrap-keys = "memory_router.key_bootstrap:main"

[tool.setuptools.packages.find]
include = ["memory_router*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["E501", "S101", "SIM105", "SIM117", "UP038"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["memory_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests_py"]

[tool.coverage.run]
branch = true
source = ["memory_router"]

[tool.coverage.report]
fail_under = 90
show_missing = true
