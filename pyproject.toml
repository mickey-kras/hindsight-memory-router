[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-memory-router"
version = "0.0.0"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.12"
dependencies = [
  "agent-memory-guard==0.3.0",
  "aiosqlite==0.22.1",
  "Pebble==5.2.1",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "rfc8785==0.1.4",
  "starlette==1.6.0",
  "structlog==26.1.0",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "coverage==7.15.4",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pip-tools==7.6.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-httpx==0.36.2",
  "pyyaml==6.0.3",
  "ruff==0.16.4",
]

[project.scripts]
memory-router = "memory_router.__main__:main"
memory-router-decrypt-quarantine = "memory_router.cli.decrypt_quarantine:main"
memory-router-migrate-legacy-quarantine = "memory_router.cli.migrate_legacy_quarantine:main"

[tool.setuptools.packages.find]
include = ["memory_router*"]

[tool.setuptools.package-data]
memory_router = ["confusables_ascii.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["E501", "SIM105", "SIM117", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["memory_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["memory_router"]

[tool.coverage.report]
fail_under = 90
show_missing = true
