[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-memory-router"
version = "0.1.2"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "python-socks==2.7.3",
    "python-multipart==0.0.22",
    "aiohttp==3.13.3",
    "cryptography==46.0.7",
    "hindsight-client==0.4.1",
    "psycopg[binary]==3.3.3",
    "prometheus-client==0.24.1",
]

[project.scripts]
hmr = "hindsight_memory_router.cli:main"

[tool.setuptools.packages.find]
include = ["hindsight_memory_router*"]

[tool.setuptools.package-data]
hindsight_memory_router = ["compat/**/*"]

[dependency-groups]
dev = []

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
